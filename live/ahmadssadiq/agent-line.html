<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>An agent step</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(650px,100% - 32px);margin:64px auto 96px}

.iso-stage{cursor:pointer;touch-action:pan-y;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;position:relative}
.iso-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.iso-svg{overflow:visible}
.al-live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.al-shadow{filter:blur(4px);opacity:.8;transform:translateY(1px)}
.al-paper>.iso-top{fill:var(--anatomy-lit-top)}
.al-trace{stroke-linejoin:round}
.al-key{fill:var(--anatomy-top);stroke:var(--anatomy-hi);stroke-width:var(--anatomy-weight);stroke-linejoin:round;vector-effect:non-scaling-stroke}
.al-bit-dot{fill:var(--anatomy-dot);stroke:none;transition:opacity 240ms var(--anatomy-ease)}
@media (prefers-reduced-motion:reduce){.iso-stage *{transition:none!important}}

`;

// The agent line: layout, model and the geometry that changes per frame.
// One factory, shared by the build (Node) and the page (inlined), so the readout,
// the motion and the drawing all read the same numbers. `k` is the kit.

function createCore(k) {
  const L = {
    WIDTH: 600,
    HEIGHT: 312,
    VIEW_AZIMUTH: 50,
    BASE: { x: -150, y: -48, w: 300, d: 118, r: 9 },
    BASE_H: 9,
    FOOT_H: 5,
    RAIL_Y: 7,
    RAIL_W: 3.5,
    RAIL_X0: -140,
    RAIL_X1: 140,
    RAIL_H: 3,
    CART_W: 30,
    CART_D: 23,
    CART_Z: 3,
    CART_H: 3.2,
    CARD_W: 24,
    CARD_D: 17,
    CARD_H: 1.4,
    TAB_X: [-11, -6, -1, 4, 9],
    TAB_Y: -8,
    TAB_W: 2.6,
    TAB_D: 1.8,
    TAB_NORMAL: [4, 5, 4, 5, 4],
    TAB_TALL: 14,
    BAD_TAB: 2,
    ZONE: [6, 2.2],
    HOME_X: -123,
    TOOL_X: [-101, -82, -63, -44],
    GATE_X: -8,
    JAM_X: -13.6,
    PRESS_X: 56,
    OUT_X: 118,
    TRAY_Z: 2.5,
    TRAY_H: 4,
    DRAWER_STROKE: 7,
    BRIDGE_Z: 17.5,
    BRIDGE_H: 5.5,
    POST_FACE_Y: -16,
    LOCK_Z: 17.5,
    RAM_RISE: 9,
    PAPER_X: -126,
    PAPER_W: 252,
    PAPER_Y: 38,
    PAPER_D: 22,
    PAPER_Z: 0.8,
    PEN_Y: 38.6,
    SPEED: 5,
    RULING: 4,
  };
  L.CART_TOP = L.CART_Z + L.CART_H;
  L.CARD_TOP = L.CART_TOP + L.CARD_H;
  L.TRAY_TOP = L.TRAY_Z + L.TRAY_H;
  L.RAM_X = L.PRESS_X + L.ZONE[0];
  L.RAM_Y = L.ZONE[1];
  L.PEN_X = [-72, L.GATE_X, L.RAM_X, L.OUT_X];
  L.HISTORY = L.PAPER_D / L.SPEED;

  // ─── Camera ────────────────────────────────────────────────────────────────
  const P = k.fitProjection(
    [...k.boxCorners(L.BASE, -L.BASE_H - L.FOOT_H, 0), [56, -27, 40], [70, 11, 40]],
    L.WIDTH,
    L.HEIGHT,
    { pad: 26, azimuth: L.VIEW_AZIMUTH },
  );
  const at = (point) => k.iso(point, P);
  const shift = (x = 0, y = 0, z = 0) => k.translateAlong(P, [x, y, z]);

  // ─── Model: a job is a pure function of time ───────────────────────────────
  // Four-bit agent identities: the same pattern is on the plate, the key and the stamp.
  const AGENTS = [3, 5, 6, 9];
  const TOOLS = L.TOOL_X.length;

  const clamp01 = (value) => Math.min(1, Math.max(0, value));
  const smooth = (value) => {
    const u = clamp01(value);
    return u * u * (3 - 2 * u);
  };

  function track(keys) {
    return (t) => {
      if (t <= keys[0][0]) return keys[0][1];
      for (let index = 0; index < keys.length - 1; index++) {
        const [t0, v0] = keys[index];
        const [t1, v1] = keys[index + 1];
        if (t < t1) return t1 > t0 ? v0 + (v1 - v0) * smooth((t - t0) / (t1 - t0)) : v1;
      }
      return keys[keys.length - 1][1];
    };
  }

  const drive = (from, to) => 0.45 + Math.abs(to - from) / 75;

  // The time a smoothstep move from `a` to `b` (starting at t0, lasting d) passes `where`.
  function crossing(t0, d, a, b, where) {
    const want = clamp01((where - a) / (b - a));
    let low = 0;
    let high = 1;
    for (let step = 0; step < 24; step++) {
      const mid = (low + high) / 2;
      if (smooth(mid) < want) low = mid;
      else high = mid;
    }
    return t0 + d * ((low + high) / 2);
  }

  function scriptOf(job) {
    const x = [[0, L.HOME_X]];
    const drawer = [[0, 0]];
    const tall = [[0, 0]];
    const key = [[0, 0]];
    const ram = [[0, 1]];
    const stamp = [[0, 0]];
    const lamp = [];
    const phases = [[0, "planning"]];
    const events = [{ at: 0.15, pen: 0, size: 3 }];
    let t = 0.3;

    const move = (from, to, scale = 1) => {
      const d = drive(from, to) * scale;
      x.push([t, from], [t + d, to]);
      const started = t;
      t += d;
      return { started, d };
    };

    // 1. The planner picks a tool: the cart stops at its drawer and the drawer opens.
    const stop = L.TOOL_X[job.tool];
    move(L.HOME_X, stop);
    phases.push([t, "tool"]);
    drawer.push([t, 0], [t + 0.45, 1], [t + 0.8, 1], [t + 1.25, 0]);
    events.push({ at: t + 0.45, pen: 0, size: 6 });
    if (job.bad) tall.push([t + 0.7, 0], [t + 1.2, 1]);
    t += 1.45;

    // 2. The gate. A card with a field that doesn't fit stops at the bridge, goes back, is repaired.
    let from = stop;
    phases.push([t, "checking"]);
    if (job.bad) {
      move(stop, L.JAM_X);
      events.push({ at: t, pen: 1, size: 9, hold: 0.9 });
      lamp.push([t, t + 1.05]);
      phases.push([t, "rejected"]);
      t += 1.15;
      move(L.JAM_X, L.HOME_X, 0.85);
      phases.push([t, "repair"]);
      tall.push([t, 1], [t + 0.5, 0]);
      t += 0.75;
      from = L.HOME_X;
    }
    const run = move(from, L.PRESS_X);
    const cross = crossing(run.started, run.d, from, L.PRESS_X, L.GATE_X);
    events.push({ at: cross, pen: 1, size: 5 });
    phases.push([cross, "passed"]);

    // 3. The press: the key turns, the ram comes down, the seal is stamped, the ram goes back.
    phases.push([t, "sealing"]);
    key.push([t, 0], [t + 0.45, 1], [t + 1.5, 1], [t + 1.9, 0]);
    ram.push([t + 0.5, 1], [t + 0.8, 0], [t + 0.95, 0], [t + 1.4, 1]);
    stamp.push([t + 0.78, 0], [t + 0.92, 1]);
    events.push({ at: t + 0.8, pen: 2, size: 7 });
    t += 2;

    // 4. Out of the line, then the cart goes home and takes a fresh card.
    move(L.PRESS_X, L.OUT_X);
    phases.push([t, "delivered"]);
    events.push({ at: t, pen: 3, size: 4 });
    t += 0.6;
    move(L.OUT_X, L.HOME_X, 0.8);
    stamp.push([t, 1], [t + 0.3, 0]);
    t += 0.4;

    const xs = track(x);
    const ds = track(drawer);
    const ts = track(tall);
    const ks = track(key);
    const rs = track(ram);
    const ss = track(stamp);

    return {
      duration: t,
      events,
      at(time) {
        let phase = "planning";
        for (const [begin, name] of phases) if (time >= begin) phase = name;
        return {
          x: xs(time),
          drawer: ds(time),
          tall: ts(time),
          lamp: lamp.some(([a, b]) => time >= a && time < b),
          key: ks(time),
          ram: rs(time),
          stamp: ss(time),
          phase,
        };
      },
    };
  }

  const REST = { x: L.HOME_X, drawer: 0, tall: 0, lamp: false, key: 0, ram: 1, stamp: 0, phase: "planning" };

  // A pen's deflection (world units, along the paper) from the events logged for it.
  const RISE = 0.12;
  const FALL = 0.45;

  function deflection(log, pen, time) {
    let sum = 0;
    for (const event of log) {
      if (event.pen !== pen) continue;
      const age = time - event.at;
      if (age < 0) continue;
      const hold = event.hold || 0;
      if (age < RISE) sum += event.size * smooth(age / RISE);
      else if (age < RISE + hold) sum += event.size;
      else {
        const value = event.size * Math.exp(-(age - RISE - hold) / FALL);
        if (value > 0.01) sum += value;
      }
    }
    return sum;
  }

  const pad = (value, width) => String(value).padStart(width, "0");
  const tagOf = (job) => `#${pad(job.id, 4)} · agent ${pad(job.agent, 2)}`;

  function readoutOf(job, phase, script, next, running = true) {
    const queued = `tool ${next.tool + 1} next${next.bad ? " · bad card" : ""}`;
    if (!job) return `idle · ${queued}`;
    if (!running) return `${script ? script.events.length : 0} events traced · ${queued}`;
    const tag = tagOf(job);
    switch (phase) {
      case "planning":
        return `${tag} · planning`;
      case "tool":
        return `${tag} · tool ${job.tool + 1} called`;
      case "checking":
        return `${tag} · checking schema`;
      case "rejected":
        return `${tag} · schema failed`;
      case "repair":
        return `${tag} · repairing output`;
      case "passed":
        return `${tag} · schema ok`;
      case "sealing":
        return `${tag} · sealing`;
      default:
        return `${tag} · ${script ? script.events.length : 0} events traced`;
    }
  }

  function spokenOf(job, phase, script, next) {
    if (!job) return `Idle. Tool ${next.tool + 1} is next${next.bad ? ", with a malformed card" : ""}.`;
    const who = `Job ${job.id}, agent ${job.agent}`;
    switch (phase) {
      case "planning":
        return `${who}: planning.`;
      case "tool":
        return `${who}: calling tool ${job.tool + 1}.`;
      case "checking":
        return `${who}: checking the output against the schema.`;
      case "rejected":
        return `${who}: the output does not fit the schema and is sent back.`;
      case "repair":
        return `${who}: output repaired, trying again.`;
      case "passed":
        return `${who}: output fits the schema.`;
      case "sealing":
        return `${who}: sealing with the agent's key.`;
      default:
        return `${who}: delivered. ${script ? script.events.length : 0} events traced.`;
    }
  }

  // ─── Geometry that changes per frame ───────────────────────────────────────
  const tabPlan = (index) => ({ x: L.TAB_X[index], y: L.TAB_Y, w: L.TAB_W, d: L.TAB_D, r: 0.5 });

  // The one field that can come out malformed, rebuilt at its current height.
  function tabOf(tallness) {
    const base = L.TAB_NORMAL[L.BAD_TAB];
    return k.slabOf(tabPlan(L.BAD_TAB), L.CARD_TOP, base + (L.TAB_TALL - base) * tallness, P, 2, 0.3);
  }

  // The key, drawn flat on the lock plate and turned about the lock axis.
  const BIT_ANGLES = [45, 135, 225, 315].map((degrees) => (degrees * Math.PI) / 180);
  const KEY_Y = L.POST_FACE_Y + 0.7 + 0.5;
  const KEY_HEAD = 5.4;

  function keyPoint(turn, a, b) {
    const theta = (turn * Math.PI) / 2;
    const c = Math.cos(theta);
    const s = Math.sin(theta);
    return at([L.RAM_X + a * c - b * s, KEY_Y, L.LOCK_Z + a * s + b * c]);
  }

  function keyOf(turn) {
    const neck = [keyPoint(turn, 1, -0.8), keyPoint(turn, 3.4, -0.8), keyPoint(turn, 3.4, 0.8), keyPoint(turn, 1, 0.8)];
    const head = [];
    for (let step = 0; step < 20; step++) {
      const angle = (step / 20) * Math.PI * 2;
      head.push(keyPoint(turn, KEY_HEAD + 2.6 * Math.cos(angle), 2.6 * Math.sin(angle)));
    }
    const dots = BIT_ANGLES.map((angle) => {
      const around = angle - Math.PI / 4;
      return keyPoint(turn, KEY_HEAD + 1.3 * Math.cos(around), 1.3 * Math.sin(around));
    });
    return { neck: k.pathOf(neck, true), head: k.pathOf(head, true), dots };
  }

  // What the pens have drawn so far: one trace per pen, running off the front of the
  // paper, plus the ruling that scrolls with it.
  const SAMPLES = 46;

  function chartOf(log, now) {
    const traces = [];
    const push = [];
    L.PEN_X.forEach((x, pen) => {
      const points = [];
      for (let sample = 0; sample < SAMPLES; sample++) {
        const age = (sample / (SAMPLES - 1)) * (L.HISTORY + 0.4);
        points.push(at([x + deflection(log, pen, now - age), L.PEN_Y + age * L.SPEED, L.PAPER_Z]));
      }
      traces.push(k.pathOf(points));
      push.push(deflection(log, pen, now));
    });
    const lines = [];
    const offset = (now * L.SPEED) % L.RULING;
    for (let row = 0; L.PAPER_Y + offset + row * L.RULING < L.PAPER_Y + L.PAPER_D + 0.01; row++) {
      const y = L.PAPER_Y + offset + row * L.RULING;
      if (y < L.PAPER_Y + 0.4) continue;
      lines.push(k.onTop([[L.PAPER_X, y], [L.PAPER_X + L.PAPER_W, y]], L.PAPER_Z, P));
    }
    return { traces, ruling: lines.join(""), push };
  }

  return { L, P, at, shift, AGENTS, TOOLS, REST, BIT_ANGLES, scriptOf, deflection, readoutOf, spokenOf, tagOf, tabOf, keyOf, chartOf };
}


const core = createCore({ fitProjection, boxCorners, iso, slabOf, onTop, pathOf, translateAlong });
// The live page: one loop over one simulation. Everything shown is read from the model.
const { L, shift, AGENTS, TOOLS, REST, BIT_ANGLES, scriptOf, readoutOf, spokenOf, tabOf, keyOf, chartOf } = core;

const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const readout = document.querySelector("[data-readout]");
const live = stage.querySelector(".al-live");
const still = matchMedia("(prefers-reduced-motion: reduce)");

const part = (name) => svg.querySelector(`[data-part="${name}"]`);
const parts = (name) => [...svg.querySelectorAll(`[data-part="${name}"]`)];
const trays = parts("tray").sort((a, b) => Number(a.dataset.tool) - Number(b.dataset.tool));
const pens = parts("pen");
const traces = parts("trace");
const ruling = part("ruling");
const cart = part("cart");
const cardSolid = part("card").querySelector(".iso-solid");
const bridgeSolid = part("bridge").querySelector(".iso-solid");
const ram = part("ram");
const stamp = part("stamp");
const neck = part("neck");
const head = part("head");
const keyDots = parts("key-dot");
const stampDots = parts("stamp-dot");
const plateDots = parts("plate-dot");
const tab = part("tab");
const tabFill = tab.querySelector(".iso-fill");
const tabShades = [...tab.querySelectorAll(".iso-shade")];
const tabTop = tab.querySelector(".iso-top");
const tabCrease = tab.querySelector(".iso-crease");
const tabBevel = tab.querySelector(".iso-bevel");
const tabEdge = tab.querySelector(".iso-edge");

const TOUR_FIRST = 1400;
const TOUR_BACK = 3600;
const TOUR_GAP = 0.9;
const LOG_KEEP = L.HISTORY + 1.5;
const NUDGE = 1.6;
const QUEUE_MOST = 3;
const TOUR_TOOLS = [1, 3, 0, 2];

const sim = { now: 0, running: false, job: null, script: null, start: 0, rest: -10, queue: [], log: [], made: 0, tool: 1, bad: false, nudge: [0, 0, 0, 0] };
const shown = { tall: -1, key: -1, agent: -1, phase: "", lit: null, text: "" };
let frame = 0;
let last = 0;
let visible = false;
let engaged = false;
let tourFrom = 0;

const bitOf = (agent, index) => (agent >> (3 - index)) & 1;
const round1 = (value) => Math.round(value * 10) / 10;
const put = (node, name, value) => {
  if (node && node.getAttribute(name) !== value) node.setAttribute(name, value);
};
const follow = (current, target, dt, seconds, snap) => {
  if (snap) return target;
  const next = current + (target - current) * (1 - Math.exp(-dt / seconds));
  return Math.abs(target - next) < 1e-3 ? target : next;
};
const nextAgent = () => AGENTS[(sim.made + 1) % AGENTS.length];

function makeJob(tool, bad) {
  sim.made += 1;
  return { id: sim.made, agent: AGENTS[sim.made % AGENTS.length], tool, bad };
}

function begin(calm) {
  const job = sim.queue.shift();
  if (!job) return;
  const script = scriptOf(job);
  sim.job = job;
  sim.script = script;
  sim.start = sim.now;
  sim.running = true;
  for (const event of script.events) sim.log.push({ ...event, at: sim.start + event.at });
  if (calm) {
    sim.now = sim.start + script.duration;
    sim.running = false;
    sim.rest = sim.now;
  }
}

function draw(dt) {
  const job = sim.job;
  const pose = sim.script ? (sim.running ? sim.script.at(sim.now - sim.start) : sim.script.at(sim.script.duration)) : REST;
  const agent = job ? job.agent : nextAgent();

  put(cart, "transform", shift(pose.x));
  put(stamp, "opacity", `${Math.round(pose.stamp * 100) / 100}`);
  if (shown.lit !== pose.lamp) {
    shown.lit = pose.lamp;
    cardSolid.toggleAttribute("data-lit", !pose.lamp);
    bridgeSolid.toggleAttribute("data-lit", pose.lamp);
  }

  const tall = Math.round(pose.tall * 200) / 200;
  if (shown.tall !== tall) {
    shown.tall = tall;
    const paths = tabOf(tall);
    put(tabFill, "d", paths.fill);
    paths.shades.forEach((d, index) => put(tabShades[index], "d", d));
    put(tabTop, "d", paths.top);
    put(tabCrease, "d", paths.crease);
    put(tabBevel, "d", paths.bevel || "");
    put(tabEdge, "d", paths.outline);
  }

  sim.nudge = sim.nudge.map((value, index) => follow(value, !sim.running && index === sim.tool ? NUDGE : 0, dt, 0.15, dt === 0));
  for (let index = 0; index < TOOLS; index++) {
    const out = job && index === job.tool && sim.running ? pose.drawer * L.DRAWER_STROKE : 0;
    put(trays[index], "transform", shift(0, out + sim.nudge[index]));
  }

  put(ram, "transform", shift(0, 0, pose.ram * L.RAM_RISE));
  const turn = Math.round(pose.key * 200) / 200;
  if (shown.key !== turn) {
    shown.key = turn;
    const key = keyOf(turn);
    put(neck, "d", key.neck);
    put(head, "d", key.head);
    key.dots.forEach(([x, y], index) => {
      put(keyDots[index], "cx", `${round1(x)}`);
      put(keyDots[index], "cy", `${round1(y)}`);
    });
  }
  if (shown.agent !== agent) {
    shown.agent = agent;
    for (let index = 0; index < 4; index++) {
      const level = bitOf(agent, index) ? "" : "0.1";
      for (const dots of [keyDots, stampDots, plateDots]) dots[index].style.opacity = level;
    }
  }

  const chart = chartOf(sim.log, sim.now);
  chart.traces.forEach((d, index) => put(traces[index], "d", d));
  put(ruling, "d", chart.ruling);
  chart.push.forEach((value, index) => put(pens[index], "transform", shift(value)));

  const next = { tool: sim.tool, bad: sim.bad };
  const text = readoutOf(job, pose.phase, sim.script, next, sim.running);
  if (shown.text !== text) {
    shown.text = text;
    readout.textContent = text;
  }
  const key = `${job ? job.id : 0}:${pose.phase}:${sim.running}`;
  if (shown.phase !== key) {
    shown.phase = key;
    live.textContent = spokenOf(job, pose.phase, sim.script, next);
  }
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  const tourOn = !calm && !engaged;
  if (tourOn && performance.now() >= tourFrom && !sim.running && sim.queue.length === 0 && sim.now - sim.rest > TOUR_GAP) {
    const index = sim.made;
    sim.queue.push(makeJob(TOUR_TOOLS[index % TOUR_TOOLS.length], index % 3 === 1));
  }
  if (!sim.running && sim.queue.length) begin(calm);
  if (!calm) sim.now += dt;
  if (sim.running && sim.now - sim.start >= sim.script.duration) {
    sim.running = false;
    sim.rest = sim.now;
  }
  sim.log = sim.log.filter((event) => sim.now - event.at < LOG_KEEP);
  draw(calm ? 0 : dt);
  const recent = sim.log.some((event) => sim.now - event.at < L.HISTORY + 0.5);
  const easing = sim.nudge.some((value, index) => value !== (!sim.running && index === sim.tool ? NUDGE : 0));
  frame = visible && (sim.running || sim.queue.length > 0 || recent || tourOn || easing) ? requestAnimationFrame(tick) : 0;
}

const run = () => {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
};
const later = () => {
  tourFrom = performance.now() + TOUR_BACK;
  setTimeout(run, TOUR_BACK + 40);
};
const wake = () => {
  later();
  run();
};
const enqueue = (tool) => {
  sim.tool = tool;
  if (sim.queue.length < QUEUE_MOST) {
    sim.queue.push(makeJob(tool, sim.bad));
    sim.bad = false;
  }
  wake();
};
const choose = (tool) => {
  sim.tool = (tool + TOOLS) % TOOLS;
  wake();
  draw(0);
};

new IntersectionObserver(
  (entries) => {
    visible = entries[entries.length - 1].isIntersecting;
    if (visible) {
      tourFrom = performance.now() + TOUR_FIRST;
      setTimeout(run, TOUR_FIRST + 40);
      run();
    }
  },
  { rootMargin: "120px 0px" },
).observe(stage);

stage.addEventListener("pointerenter", (event) => {
  if (event.pointerType === "mouse") engaged = true;
});
stage.addEventListener("pointerleave", (event) => {
  if (event.pointerType !== "mouse") return;
  engaged = false;
  later();
});
stage.addEventListener("pointerdown", (event) => {
  const target = event.target.closest && event.target.closest("[data-tool]");
  enqueue(target ? Number(target.dataset.tool) : sim.tool);
});
stage.addEventListener("focus", () => {
  engaged = true;
});
stage.addEventListener("blur", () => {
  engaged = false;
  later();
});
stage.addEventListener("keydown", (event) => {
  if (event.key === " " || event.key === "Enter") {
    event.preventDefault();
    if (!event.repeat) enqueue(sim.tool);
  } else if (event.key === "ArrowRight" || event.key === "ArrowDown") {
    event.preventDefault();
    choose(sim.tool + 1);
  } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
    event.preventDefault();
    choose(sim.tool - 1);
  } else if (event.key === "b" || event.key === "B") {
    event.preventDefault();
    sim.bad = !sim.bad;
    wake();
    draw(0);
  } else if (/^[1-4]$/.test(event.key)) {
    event.preventDefault();
    choose(Number(event.key) - 1);
  }
});

draw(0);

</script></body></html>
