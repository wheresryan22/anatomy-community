<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BMW iX3 on the bench</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(720px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>.iso{--cx-cell:#2a2a2a;--cx-cell-full:#d8d8d8;--cx-glass:#171a1c;--cx-hot:#e6e6e6}
.iso[data-theme="light"]{--cx-cell:#e4e4e1;--cx-cell-full:#2c2c30;--cx-glass:#eef1f2;--cx-hot:#2a2a2e}
.cx-stage{position:relative;outline:none;touch-action:pan-y;cursor:pointer}
.cx-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.cx-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* cell tops: rings that fill as the battery charges */
.cx-cell{fill:var(--cx-cell);stroke:var(--anatomy-lo);stroke-width:.35;transition:fill 400ms var(--anatomy-ease)}
.cx-cell[data-full]{fill:var(--cx-cell-full);stroke:var(--anatomy-hi)}

/* glass: a cool tint of the paper */
.it[data-glass] .iso-fill{fill:var(--cx-glass);fill-opacity:.18}
.it[data-glass] .iso-shade,.it[data-glass] .iso-top{fill:var(--cx-glass);fill-opacity:.22}
.it[data-glass] .iso-edge{stroke:var(--anatomy-mid)}

/* a line carrying power lights */
.it[data-hot] .tb-body{fill:var(--cx-hot)}
.it[data-hot] .tb-shine,.it[data-hot] .tb-shade{fill:var(--cx-hot)}
.it[data-hot] .tb-edge{stroke:var(--anatomy-lit)}

/* the motors and wheels are the lit accent while driving */
.cx-stage[data-mode="drive"] .it[data-name^="front.motor"] .iso-edge,.cx-stage[data-mode="drive"] .it[data-name^="rear.motor"] .iso-edge,.cx-stage[data-mode="drive"] .it[data-wheel] .iso-edge{stroke:var(--anatomy-lit)}
.cx-stage[data-mode="drive"] .it[data-name^="front.motor"] .iso-top,.cx-stage[data-mode="drive"] .it[data-name^="rear.motor"] .iso-top{fill:var(--anatomy-lit-top)}
.cx-stage[data-mode="charge"] .it[data-name^="battery"] .iso-edge{stroke:var(--anatomy-lit)}

/* picking an assembly: it takes the lit accent, everything else steps down */
.it{transition:opacity 260ms var(--anatomy-ease)}
.cx-stage[data-focus] .it:not([data-on]){opacity:.38}
.it[data-on] .iso-edge,.it[data-on] .tb-edge{stroke:var(--anatomy-lit)}
.it[data-on] .iso-top{fill:var(--anatomy-lit-top)}
.it[data-on] .iso-shade{fill:var(--anatomy-lit-shade)}

.cx-parts{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:14px}
.cx-part{font:10.5px/1 var(--anatomy-mono);letter-spacing:.04em;color:var(--anatomy-muted);background:none;border:1px solid var(--anatomy-faint);padding:6px 8px;cursor:pointer}
.cx-part[data-on],.cx-part:hover{color:var(--anatomy-strong);border-color:var(--anatomy-mid)}
@media (prefers-reduced-motion:reduce){.cx-cell,.it{transition:none}}
.cx-window{fill:var(--cx-screen);stroke:var(--anatomy-lo);stroke-width:.3}
.cx-digits{fill:var(--cx-screen-ink);font-family:var(--anatomy-mono);font-variant-numeric:tabular-nums}
.iso{--cx-screen:#0a0a0a;--cx-screen-ink:#e6e6e6}
.iso[data-theme="light"]{--cx-screen:#26262a;--cx-screen-ink:#f4f4f1}
/* black plastic: arch trims and sill cladding */
.iso{--cx-trim:#0c0c0c;--cx-trim-top:#161616}
.iso[data-theme="light"]{--cx-trim:#4a4a4e;--cx-trim-top:#5c5c60}
.it[data-trim] .iso-fill,.it[data-trim] .iso-shade{fill:var(--cx-trim)}
.it[data-trim] .iso-top{fill:var(--cx-trim-top)}

y charge, the wheels and motors as it drives, a part you pick</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Body shell: it lifts off when the car comes apart; the glass shows the cabin</span><span class="iso-key"><svg class="iso-swatch" data-mark="edge" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>High-voltage lines: battery to each inverter, and the charger's cable to the port</span></span><span class="iso-caption">The BMW iX3 50 xDrive, first car of the Neue Klasse (2025), at 1 : 10 on a workshop bench. It is 4,782 mm long on a 2,897 mm wheelbase and weighs 2,285 kg. A 108.7 kWh, 800 V battery of cylindrical cells, packed straight into the floor without modules, feeds an induction motor at the front and an electrically excited synchronous motor at the rear: 345 kW and 645 N·m together, 0–100 km/h in 4.9 s, 210 km/h top speed. On a 400 kW charger it goes from 10 to 80% in 21 minutes; its WLTP range is up to 805 km. Drive runs a 0–100 sprint from a model of the car's mass and power, tuned to BMW's time; Charge plays the 21 minutes as a time-lapse on an illustrative charging curve with BMW's peak and total. Take it apart to see its eight assemblies.</span></figcaption><div class="cx-parts"><button type="button" class="cx-part" data-part="body">01 Body</button><button type="button" class="cx-part" data-part="cabin">02 Cabin</button><button type="button" class="cx-part" data-part="battery">03 Battery</button><button type="button" class="cx-part" data-part="front">04 Front drive unit</button><button type="button" class="cx-part" data-part="rear">05 Rear drive unit</button><button type="button" class="cx-part" data-part="fl">06 Front left corner</button></div></figure><style>.credit{margin:40px 0 0;color:var(--anatomy-muted);font:11px/1.4 var(--anatomy-mono);letter-spacing:.04em}.credit a{color:var(--anatomy-text);text-decoration:none;border-bottom:1px solid var(--anatomy-faint)}.credit a:hover{color:var(--anatomy-strong);border-color:var(--anatomy-mid)}</style><p class="credit">Made by Studio Little Nice Things</p></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];

      split(s0, s1, 0);

function smoothRows(meridian, F, P, { rows = 6, slope = null, radius = null, steps = 48, error = 0.35, depth: deepest = 8, fineness = 0.1 } = {}) {

    const b = faces[k];
    const x = a[0] + b[0];
    const y = a[1] + b[1];
    const length = Math.hypot(x, y) || 1;

    const [s0] = meridian[i];

    const b = vertexNormal(i + 1, faces[i]);

      out.to -= TAU;

    const above = (b.groups.get(tone) ?? []).map((arc) => ({ arc, used: false }));

      const points = [...arcPoints(a.i, a.u, lo.from, lo.to), ...arcPoints(b.i, b.u, hi.from, hi.to).reverse()];

    }
    run = [];
  };
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];

      continue;
    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;

        return;
      }
      refine(a, mid, depth + 1);
      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {

  let last = m - 1;

  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;

    for (let index = 0; index < hull.length; index++) {

      const dy = b[1] - a[1];

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {

function shapeOf(meridian, P, smooth) {

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {

const signedArea = (points) => points.reduce((sum, [x, y], index) => {

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

const TRACTION = Math.round((lo + hi) / 2);

// Advance a drive state { v (m/s), x (m), throttle 0..1 } by dt seconds; returns power in kW.
function stepDrive(state, dt) {

function curve(soc, end) {

let a = 0.05;
let b = 1;
for (let i = 0; i < 50; i++) {

// Advance { soc } by dt minutes at the charger; returns kW.
function stepCharge(state, minutes) {
  let left = minutes;
  let power = 0;
  while (left > 1e-9 && state.soc < 0.8) {

    power = chargePower(state.soc);

const D = {"P":{"origin":[327.18385628087617,373.73190693105437],"scale":0.7611686994026364,"azimuth":56,"elevation":36},"V":[0.4523965620417037,0.6707054851723823,0.5877852522924731],"EX":[0.798206253430692,0.3164617671844212],"EY":[-0.5383969161358664,0.4691738640541985],"EZ":[0,-0.7789302263485638],"pieces":{"body":{"name":"Body","say":"body · steel and aluminium shell, glass roof"},"cabin":{"name":"Cabin","say":"cabin · seats, dash and the panoramic display"},"fl":{"name":"Front left corner","say":"front left corner · strut, brake, 20-inch wheel"},"fr":{"name":"Front right corner","say":"front right corner · strut, brake, 20-inch wheel"},"rl":{"name":"Rear left corner","say":"rear left corner · strut, brake, 20-inch wheel"},"rr":{"name":"Rear right corner","say":"rear right corner · strut, brake, 20-inch wheel"},"front":{"name":"Front drive unit","say":"front motor · induction, drives on demand"},"rear":{"name":"Rear drive unit","say":"rear motor · electrically excited synchronous"},"battery":{"name":"Battery","say":"battery · 108.7 kWh, 800 V, cylindrical cells"},"stand":{"name":"Stand","say":""}},"stagger":["body","cabin","fl","rl","fr","rr","front","rear","battery","stand"],"spring":{"stagger":0.045,"stiffness":52,"damping":13.2,"substeps":4},"wheels":[{"id":"fl","F":{"o":[144.85,80,40.7],"a":[0,1,0],"u":[1,0,0],"v":[0,0,1]},"face":13.65},{"id":"fr","F":{"o":[144.85,-80,40.7],"a":[0,-1,0],"u":[1,0,0],"v":[0,0,1]},"face":13.65},{"id":"rl","F":{"o":[-144.85,80,40.7],"a":[0,1,0],"u":[1,0,0],"v":[0,0,1]},"face":13.65},{"id":"rr","F":{"o":[-144.85,-80,40.7],"a":[0,-1,0],"u":[1,0,0],"v":[0,0,1]},"face":13.65}],"cells":39,"routes":{"fl.shaft":{"total":25.85},"fr.shaft":{"total":22.85},"rl.shaft":{"total":23.85},"rr.shaft":{"total":20.85},"steering.column":{"total":14},"steering.spoke":{"total":11},"charge.cable":{"total":14.25},"hv.front":{"total":60.02},"hv.rear":{"total":62.02}}};
const PJ = D.P;
const stage = document.querySelector(".cx-stage");
const svg = stage.querySelector("svg");
const car = svg.querySelector(".cx-car");
const readout = document.querySelector("[data-readout]");
const status = stage.querySelector("[data-status]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const partButtons = [...document.querySelectorAll(".cx-part")];
const STAGGER = D.stagger;
const SPRING = D.spring;
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];

const nodes = [...car.querySelectorAll(":scope > .it")].map((el) => {
  const m = el.dataset.m.split(",").map(Number);
  return { el, piece: el.dataset.piece, key: +el.dataset.k, m, lift: dot(m, D.V), shown: "" };
});
let order = nodes.map((_, i) => i);
const piece = Object.fromEntries(STAGGER.map((id) => [id, { x: 0, v: 0, target: 0, pending: null }]));
const cells = [...svg.querySelectorAll(".cx-cell")];
const spokes = Object.fromEntries([...svg.querySelectorAll("[data-spokes]")].map((el) => [el.dataset.spokes, el.querySelector("path")]));
const chargeLine = nodes.filter((n) => n.el.dataset.route === "charge.cable");
const chargerPct = svg.querySelector('[data-charger="pct"]');
const chargerKw = svg.querySelector('[data-charger="kw"]');
const hvLines = nodes.filter((n) => n.el.dataset.route === "hv.front" || n.el.dataset.route === "hv.rear");

let clock = 0;
let apart = false;
let selected = null;
let mode = "parked"; // parked · drive · charge
let armed = null;
let soc = 0.8;
const drive = { v: 0, x: 0, throttle: 0, braking: false, t: 0, at100: null, power: 0, phase: "" };
let chargeKw = 0;
let chargeMin = 0;
let touring = !still.matches;
let tourClock = 0;
let tourStep = 0;
let idleTimer = 0;
let visible = false;
let frame = 0;
let last = 0;

const fmt = (v) => Math.round(v).toLocaleString("en-US");
function say(text) {
  if (readout.textContent !== text) readout.textContent = text;
}
function announce(text) {
  status.textContent = text;
  stage.setAttribute("aria-valuetext", text);
}

function setApart(on) {
  if (apart === on) return;
  apart = on;
  const goal = on ? 1 : 0;
  const list = (on ? STAGGER : [...STAGGER].reverse()).filter((id) => piece[id].target !== goal || piece[id].pending);
  let index = 0;
  for (const id of on ? STAGGER : [...STAGGER].reverse()) {
    if (piece[id].target === goal && !piece[id].pending) continue;
    if (piece[id].target === goal) piece[id].pending = null;
    else piece[id].pending = { value: goal, at: clock + (still.matches ? 0 : index++ * SPRING.stagger) };
  }
  void list;
  announce(on ? "Taking apart: body, cabin, four corners, two drive units, battery." : "Putting it back together.");
  run();
}

function select(id) {
  if (id === "stand") id = null;
  if (selected === id) return;
  selected = id;
  for (const node of nodes) {
    if (id && node.piece === id) node.el.setAttribute("data-on", "");
    else node.el.removeAttribute("data-on");
  }
  if (id) stage.setAttribute("data-focus", "");
  else stage.removeAttribute("data-focus");
  partButtons.forEach((b) => (b.dataset.part === id ? b.setAttribute("data-on", "") : b.removeAttribute("data-on")));
  if (id) announce(D.pieces[id].say);
}

function steer(state, dt, calm) {
  if (state.pending && clock >= state.pending.at) {
    state.target = state.pending.value;
    state.pending = null;
  }
  if (calm) {
    state.x = state.target;
    state.v = 0;
    return false;
  }
  for (let i = 0; i < SPRING.substeps; i++) {
    const h = dt / SPRING.substeps;
    state.v += ((state.target - state.x) * SPRING.stiffness - state.v * SPRING.damping) * h;
    state.x += state.v * h;

    state.v = 0;

function place() {
  for (const node of nodes) {
    const share = piece[node.piece].x;
    const tx = (D.EX[0] * node.m[0] + D.EY[0] * node.m[1] + D.EZ[0] * node.m[2]) * share;
    const ty = (D.EX[1] * node.m[0] + D.EY[1] * node.m[1] + D.EZ[1] * node.m[2]) * share;
    const text = share === 0 ? "" : `translate(${tx.toFixed(2)} ${ty.toFixed(2)})`;
    if (text !== node.shown) {
      node.shown = text;
      if (text) node.el.setAttribute("transform", text);
      else node.el.removeAttribute("transform");

    const fragment = document.createDocumentFragment();

const together = () => STAGGER.every((id) => piece[id].x === 0 && piece[id].target === 0 && !piece[id].pending);

function startDrive() {
  if (!together()) {
    armed = "drive";
    setApart(false);
    return;
  }
  armed = null;
  mode = "drive";
  Object.assign(drive, { v: 0, x: drive.x, throttle: 1, braking: false, t: 0, at100: null, phase: "launch" });

  announce("Launch: full power, both motors.");
  run();
}
function startCharge() {
  if (!together()) {
    armed = "charge";
    setApart(false);
    return;
  }
  armed = null;
  mode = "charge";
  soc = 0.1;
  chargeMin = 0;
  stage.setAttribute("data-mode", "charge");
  announce("Plugged in to a 400 kilowatt charger at 10 percent.");
  run();
}

  mode = "parked";
  stage.removeAttribute("data-mode");

  drive.braking = false;
}

function stepModes(dt, calm) {
  if (armed && together()) (armed === "drive" ? startDrive : startCharge)();
  if (mode === "drive") {
    if (calm) {
      drive.at100 = 4.9;
      drive.v = 0;
      park();
      announce("0 to 100 kilometres per hour in 4.9 seconds.");
      return;
    }
    drive.t += dt;
    drive.power = stepDrive(drive, dt);
    if (drive.at100 === null && drive.v >= 100 / 3.6) {
      drive.at100 = drive.t;
      drive.throttle = 0;
      drive.braking = true;
      drive.phase = "brake";
      announce(`100 kilometres per hour in ${drive.t.toFixed(1)} seconds.`);
    }
    if (drive.braking && drive.v <= 0) park();

      announce("80 percent after 21 minutes. Unplugged.");

}

let litCols = -1;
let litCharge = null;
function draw() {
  // wheels: the spokes turn with the distance driven
  const phase = -drive.x / WHEEL_R;
  for (const w of D.wheels) {
    const el = spokes[w.id];
    if (!el) continue;
    const want = phase.toFixed(3);
    if (el.dataset.phase !== want) {
      el.dataset.phase = want;

    litCols = cols;
    cells.forEach((el, i) => el.toggleAttribute("data-full", i < cols));

  if (charging !== litCharge) {
    litCharge = charging;
    chargeLine.forEach((n) => n.el.toggleAttribute("data-hot", charging));
  }
  const pctText = `${(soc * 100).toFixed(0)}%`;
  if (chargerPct.textContent !== pctText) chargerPct.textContent = pctText;
  const kwText = charging ? `${fmt(chargeKw)} kW` : "ready";
  if (chargerKw.textContent !== kwText) chargerKw.textContent = kwText;

  hvLines.forEach((n) => n.el.toggleAttribute("data-hot", driving));

  let text;

  else if (armed) text = "closing up · arming";

  else if (mode === "drive") {
    const kmh = drive.v * 3.6;
    text = drive.phase === "launch" ? `launch · ${kmh.toFixed(0)} km/h · ${drive.t.toFixed(1)} s · ${fmt(drive.power)} kW` : `0–100 in ${drive.at100.toFixed(1)} s · braking ${kmh.toFixed(0)} km/h`;
  } else if (mode === "charge") text = `charging · ${(soc * 100).toFixed(0)}% · ${fmt(chargeKw)} kW · ${chargeMin.toFixed(0)} min`;
  else text = `parked · ${(soc * 100).toFixed(0)}% · ${fmt(CAR.range * soc)} km`;

// The idle tour: a launch, a look inside, then a fast charge.
const TOUR = [
  [1.2, () => startDrive()],
  [10.5, () => setApart(true)],
  [12.6, () => select("battery")],
  [14.6, () => select("front")],
  [16.4, () => select(null)],
  [17.0, () => setApart(false)],
  [19.6, () => startCharge()],

const TOUR_LENGTH = 34;

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  clock += dt;
  const calm = still.matches;
  if (touring) {
    tourClock += dt;
    while (tourStep < TOUR.length && tourClock >= TOUR[tourStep][0]) TOUR[tourStep++][1]();
    if (tourClock >= TOUR_LENGTH) {
      tourClock = 0;
      tourStep = 0;
    }
  }

  for (const id of STAGGER) moving = steer(piece[id], dt, calm) || moving;
  stepModes(dt, calm);
  place();
  draw();

}
function run() {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
}

function takeOver() {
  touring = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (still.matches) return;
    select(null);
    touring = true;
    tourClock = 0;
    tourStep = 0;
    run();
  }, 12000);
}

new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "120px 0px" }).observe(stage);

const ORDER = ["body", "cabin", "battery", "front", "rear", "fl", "fr", "rl", "rr"];
stage.addEventListener("keydown", (event) => {
  let handled = true;
  if (event.key === " " || event.key === "Enter") {
    park();
    setApart(!apart);
  } else if (event.key === "d" || event.key === "D") startDrive();
  else if (event.key === "c" || event.key === "C") startCharge();
  else if (event.key === "ArrowRight" || event.key === "ArrowDown") select(ORDER[(ORDER.indexOf(selected) + 1) % ORDER.length]);
  else if (event.key === "ArrowLeft" || event.key === "ArrowUp") select(ORDER[(ORDER.indexOf(selected) - 1 + ORDER.length) % ORDER.length]);

  run();

svg.addEventListener("pointermove", (event) => {
  const it = event.target.closest && event.target.closest(".it");
  const id = it ? it.dataset.piece : null;
  if (id && id !== "stand") {
    takeOver();
    select(id);
    run();
  }
});
svg.addEventListener("pointerleave", () => {
  select(null);
  run();
});
svg.addEventListener("click", () => {
  takeOver();
  park();
  setApart(!apart);
});
partButtons.forEach((b) =>
  b.addEventListener("click", () => {
    takeOver();
    select(selected === b.dataset.part ? null : b.dataset.part);
    run();
  }),
);
draw();
