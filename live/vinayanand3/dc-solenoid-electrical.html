.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;

}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;

  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}

.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}

.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}

@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(900px,100% - 32px);margin:64px auto 96px}

.w-red .iso-line,.w-black .iso-line{stroke:var(--anatomy-hi)}

/* section faces */
.cut{stroke:none}
.cut-edge{fill:none;stroke:#1d2e44;stroke-width:.8px;stroke-linejoin:round}
.c-iron{fill:#c8d7e9}.c-copper{fill:#efb183}.c-nylon{fill:#f2a39d}.c-brass{fill:#f1d89c}.c-plunger{fill:#a8e0dc}.c-zinc{fill:#e2e7ec}.c-dark{fill:#7d8188}.c-pin{fill:#e9edf2}
.cavity{fill:#5f7a9c}
.gap-void{fill:#3e5677}
.wire-ends{--anatomy-dot:#7a3412}
.wire-ends .iso-dots circle{opacity:.75}

/* odds and ends */
.lcd{fill:#22332b}
.lcd-text{fill:#9ff0b8;font-family:var(--anatomy-mono);font-weight:600;letter-spacing:.02em}
.lcd-small{fill:#ffd27a}
.rb-face{fill:var(--anatomy-face)}
.trace{stroke:#e2b456!important;stroke-width:1.1px!important;opacity:.85}
.led-glow{fill:#ff6a4d;opacity:0;transition:opacity .15s}
.sol-svg[data-on] .led-glow{opacity:.55}
.sol-svg [data-show]{transition:opacity .35s var(--anatomy-ease)}
.sol-svg[data-mode="whole"] [data-show="cut"],.sol-svg:not([data-mode="whole"]) [data-show="whole"]{display:none}

/* overlays: flux (blue), current (amber), forces */
.flux{fill:none;stroke:#2f6fe0;stroke-width:1.4px;stroke-linecap:round;stroke-linejoin:round}
.flux-arrow{fill:#2f6fe0}
.amp{fill:#f59e0b}
.amp-line{fill:none;stroke:#f59e0b;stroke-width:1.4px;stroke-linecap:round}
.amp-mark{fill:none;stroke:#b45309;stroke-width:1.1px}
.amp-ring{fill:#fff7e6;stroke:#b45309;stroke-width:1.1px}
.force{stroke-width:2.2px;stroke-linecap:round;fill:none}
.force-head{stroke:none}
.f-mag{stroke:#2f6fe0}.f-mag.force-head{fill:#2f6fe0}
.f-spring{stroke:#c58a1a}.f-spring.force-head{fill:#c58a1a}
.f-load{stroke:#7a3fb0}.f-load.force-head{fill:#7a3fb0}
.f-net{stroke:#1f8a4c}.f-net.force-head{fill:#1f8a4c}

/* ---------- page layout ---------- */
.iso{--anatomy-page:#f3f1ea;--anatomy-card:#fbfaf6;--anatomy-paper:#fbfaf6}
body,.iso-root{background:#f3f1ea;color:#57575a}
.iso-page{margin:40px auto 80px}
.hd{margin:0 0 26px;max-width:860px}
.kicker{font-family:var(--anatomy-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--anatomy-muted);margin:0 0 6px}
.hd h1{font-size:38px;line-height:1.08;letter-spacing:-.02em;color:var(--anatomy-strong);margin:0;font-weight:650}
.sub{font-size:19px;color:#3d5677;margin:4px 0 14px}
.lede{font-size:15px;line-height:1.65;color:var(--anatomy-text);margin:0}
.lab{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:22px;align-items:start}

</main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;

}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");

};
function pathOf(points, closed = false) {
    if (!points.length)

}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;

function signedArea(points) {

        lower.push(point);

        const chord = (curve.radius(a) + curve.radius(b)) / 2;

          split(mid, b, level + 1);
        }

      split(s0, s1, 0);

    out.push(meridian[i + 1]);

}

function smoothRows(meridian, F, P, { rows = 6, slope = null, radius = null, steps = 48, error = 0.35, depth: deepest = 8, fineness = 0.1 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const view = { a: dot3(F.a, V), flat: Math.hypot(dot3(F.u, V), dot3(F.v, V)), phi: Math.atan2(dot3(F.v, V), dot3(F.u, V)) };

  const m = meridian.length;
  const faces = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr) || 1;
    faces.push([ds / length, -dr / length]);
  }
  const splines = slope ? null : curveRuns(meridian);
  const vertexNormal = (k, own) => {
    if (k <= 0 || k >= m - 1 || !meridian[k][2]) return own;
    const a = faces[k - 1];
    const b = faces[k];
    const x = a[0] + b[0];
    const y = a[1] + b[1];
    const length = Math.hypot(x, y) || 1;
    return [x / length, y / length];
  };
  const normalAt = (i, u) => {
    const [s0] = meridian[i];
    const [s1] = meridian[i + 1];
    const s = s0 + (s1 - s0) * u;
    const sign = Math.sign(s1 - s0) || 1;
    const g = slope ? slope(s) : splines[i] ? splines[i].slope(s) : null;

      const length = Math.hypot(1, g);
      return [sign / length, (-sign * g) / length];
    }
    const a = vertexNormal(i, faces[i]);
    const b = vertexNormal(i + 1, faces[i]);
    const x = a[0] + (b[0] - a[0]) * u;
    const y = a[1] + (b[1] - a[1]) * u;
    const length = Math.hypot(x, y) || 1;
    return [x / length, y / length];
  };

    const [s0, r0] = meridian[i];
    const [s1, r1] = meridian[i + 1];

    const count = Math.max(1, Math.ceil((to - from) / fine));

  };

    let mid = (arc.from + arc.to) / 2 - reference;

    return mid;
  };
  const levelOf = (i, u) => {
    const [nr, na] = normalAt(i, u);
    const groups = new Map();

      if (!groups.has(arc.tone)) groups.set(arc.tone, []);
      groups.get(arc.tone).push(arc);
    }
    for (const list of groups.values()) list.sort((x, y) => centreOf(x, light.phi) - centreOf(y, light.phi));

  };
  const same = (x, y) => {
    if (x.groups.size !== y.groups.size) return false;
    for (const [tone, list] of x.groups) if ((y.groups.get(tone) ?? []).length !== list.length) return false;
    return true;
  };

    const out = { ...arc };
    const centre = (reference.from + reference.to) / 2;

      out.from -= TAU;
      out.to -= TAU;
    }
    while (centre - (out.from + out.to) / 2 > Math.PI) {

      out.to += TAU;
    }

  };
  const strayOf = (i, a, mid, b) => {
    let worst = 0;
    for (const [tone, list] of mid.groups) {

        const lo = align(arc, a.groups.get(tone)[index]);
        const hi = align(arc, b.groups.get(tone)[index]);
        for (const key of ["from", "to"]) {
          const p = pointAt(i, mid.u, arc[key]);
          const p0 = pointAt(i, a.u, lo[key]);
          const p1 = pointAt(i, b.u, hi[key]);

  const sheet = (tone, levels) => {
    levels[0].groups.get(tone).forEach((arc, index) => {
      const chain = [arc];
      for (let k = 1; k < levels.length; k++) chain.push(align(chain[k - 1], levels[k].groups.get(tone)[index]));
      const last = levels.length - 1;
      const points = [...arcPoints(levels[0].i, levels[0].u, chain[0].from, chain[0].to)];
      for (let k = 1; k < last; k++) points.push(pointAt(levels[k].i, levels[k].u, chain[k].to));
      points.push(...arcPoints(levels[last].i, levels[last].u, chain[last].from, chain[last].to).reverse());
      for (let k = last - 1; k >= 1; k--) points.push(pointAt(levels[k].i, levels[k].u, chain[k].from));

  const overlap = (x, y) => Math.min(x.to, y.to) - Math.max(x.from, y.from);
  const strip = (tone, a, b) => {
    const below = a.groups.get(tone) ?? [];
    const above = (b.groups.get(tone) ?? []).map((arc) => ({ arc, used: false }));
    const quad = (lo, hi) => {
      const points = [...arcPoints(a.i, a.u, lo.from, lo.to), ...arcPoints(b.i, b.u, hi.from, hi.to).reverse()];
      buckets[tone].push(pathOf(oriented(points), true));
    };
    for (const arc of below) {
      let best = null;
      let score = -Infinity;
      for (const entry of above) {
        if (entry.used) continue;
        const aligned = align(arc, entry.arc);
        const value = overlap(arc, aligned);
        if (value > score) (score = value), (best = entry);

      if (best && score > -0.05) {

        quad(arc, { from: centre, to: centre });

    for (const entry of above) {
      if (entry.used) continue;

    const tones = [...new Set(run.flatMap((level) => [...level.groups.keys()]))].sort((x, y) => x - y);
    for (const tone of tones) {
      const countOf = (level) => (level.groups.get(tone) ?? []).length;
      let start = 0;
      for (let at = 1; at <= run.length; at++) {
        if (at < run.length && countOf(run[at - 1]) === countOf(run[at])) continue;
        if (at - 1 > start && countOf(run[start])) sheet(tone, run.slice(start, at));
        if (at < run.length) strip(tone, run[at - 1], run[at]);
        start = at;
      }
    }
    run = [];
  };
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    if (Math.abs(ds) < 1e-9) {
      flush();
      continue;
    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;
    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));
    const coarse = Array.from({ length: count + 1 }, (_, index) => levelOf(i, index / count));
    run.push(coarse[0]);
    const refine = (a, b, depth) => {
      const mid = levelOf(i, (a.u + b.u) / 2);
      const split = depth < limit && (!same(a, b) || !same(a, mid) || (depth < 6 && strayOf(i, a, mid, b) > error));
      if (!split) {
        run.push(b);
        return;
      }
      refine(a, mid, depth + 1);
      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;
  if (meridian[0][1] <= 1e-9) first = 1;
  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {

  const r1 = side[side.length - 1][1];

  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);

  const keepLast = rims === "all" || rims === "last" || rims === "ends";

  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");

  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));

    gap = Math.max(gap, best);
  }
  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {

    midS.push(Math.sin(t));

    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];

        row.push(false);
        toneRow.push(0);
        continue;

    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),

function shapeOf(meridian, P, smooth) {

    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));

  }

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {

      const keepLast = rims === "last" || rims === "ends";

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

  const tones = [];
  for (let j = 0; j < n; j++) {

    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));

  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);

    fills.push(d);

    fills.push(d);

    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);

function sphereOf(centre, r, P, { steps = 48 } = {}) {

  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));

    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);

      [s0, r],
      [s1, r],
      [s1, 0],

    F,
    P,

function silhouettePoints(profile, F, P, { samples = 72, slope: given = null, radius = null } = {}) {

  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);

    let index = 1;

  Vz: 33, // clamp (zener or TVS) voltage in series with the diode (V)
  Vbr: 60, // MOSFET drain-source avalanche voltage, reached only when the flyback path has failed (V)
  alphaCu: 0.00393, // copper resistance temperature coefficient (1/K)
  damp: 2.0, // viscous damping of the plunger: air pumping and eddy drag (N·s/m)
  fs: 0.4, // static friction in the guide sleeve (N)
  fk: 0.3, // kinetic friction in the guide sleeve (N)
  e: 0.2, // coefficient of restitution at the stops
  Rth: 8, // coil-to-ambient thermal resistance (K/W)
  Cth: 25, // coil heat capacity (J/K): copper plus bobbin; with Rth a thermal time constant of 200 s
};

// Pole face shapes. A cone of half-angle α (surface to axis) turns an axial gap g into a
// perpendicular gap g·sin α over an area A/sin α, so its reluctance acts like a flat gap of g·sin²α,
// and the axial force is sin²α times the flat-face force at that equivalent gap (Roters' approximation,
// valid while the cones still overlap). The truncated cone runs from r = 3 mm to the full 8 mm radius.
const FACES = { flat: 90, cone60: 60, cone45: 45 };
const coneDepth = (face) => (FACES[face] === 90 ? 0 : (8 - 3) / Math.tan((FACES[face] * Math.PI) / 180));

// Selectable effective pole areas (round pole faces). The drawing keeps the Ø16 mm geometry.
const POLES = { 10: 10, 12: 12, 14: 14, 16: 16 };

// Clearly illustrative defaults, chosen so the ideal (unsaturated) model stays near its range of validity.
const DEFAULTS = {
  V: 12, // supply voltage (V)
  N: 600, // coil turns
  R: 12, // coil resistance at 20 °C (Ω)
  g0: 2.5, // initial air gap, plunger face to pole face, set by the stop screw (mm)
  k: 1.0, // return spring rate (N/mm)
  Fpre: 2.0, // spring preload at rest (N)
  m: 40, // plunger mass (g)
  Fload: 1.5, // constant external load opposing pull-in (N)
  pole: 16, // pole diameter (mm)
  duty: 100, // PWM duty of the low-side MOSFET (%)
  peakHold: true, // full voltage until seated, then the duty above (peak and hold)
  sat: false, // include iron saturation (advanced)
  flyback: "diode", // "diode" | "clamp" | "none"
  T: 20, // coil temperature, or the ambient it starts from when self-heating is on (°C)
  face: "flat", // pole face shape
};

const RANGES = {
  V: [6, 24, 0.5], N: [200, 1200, 10], R: [2, 30, 0.5], g0: [1, 10, 0.1], k: [0.2, 10, 0.1],
  Fpre: [0, 20, 0.5], m: [10, 150, 1], Fload: [0, 20, 0.5], duty: [10, 100, 1], T: [-20, 180, 1],
};

// Each fault edits the resolved parameters the same way the physical cause would.
const FAULTS = {
  none: (p) => p,
  open: (p) => ({ ...p, open: true }),
  shorted: (p) => ({ ...p, N: p.N * 0.7, R: p.R * 0.5 }),
  lowV: (p) => ({ ...p, V: p.V * 0.55 }),
  hot: (p) => ({ ...p, T: Math.max(p.T, 150) }),
  sticky: (p) => ({ ...p, fs: 7, fk: 4 }),
  gap: (p) => ({ ...p, g0: Math.max(p.g0, 8) }),
  preload: (p) => ({ ...p, Fpre: Math.max(p.Fpre, 14) }),
  obstruct: (p) => ({ ...p, block: 0.4 }),
  flyback: (p) => ({ ...p, flyback: "none" }),
};

// Raw slider values (engineering units) -> SI parameters the simulation uses.
function resolve(raw, fault = "none") {
  const p = FAULTS[fault] ? FAULTS[fault]({ fs: CONST.fs, fk: CONST.fk, open: false, block: null, ...raw }) : { ...raw };
  const d = (POLES[p.pole] || 16) * 1e-3;
  const g0 = p.g0 * 1e-3;
  const stroke = Math.max(0, g0 - CONST.gStop);
  return {
    V: p.V, N: p.N, R20: p.R, T: p.T, R: p.R * (1 + CONST.alphaCu * (p.T - 20)),
    g0, k: p.k * 1000, Fpre: p.Fpre, m: p.m / 1000, Fload: p.Fload, A: (Math.PI * d * d) / 4, d,
    duty: p.duty / 100, peakHold: !!p.peakHold, sat: !!p.sat, flyback: p.flyback,
    fs: p.fs ?? CONST.fs, fk: p.fk ?? CONST.fk, open: !!p.open,
    stroke, xMax: p.block ? stroke * p.block : stroke, blocked: !!p.block,
    face: FACES[p.face] ? p.face : "flat", s2: Math.sin(((FACES[p.face] || 90) * Math.PI) / 180) ** 2,
  };
}

// ---------- magnetic circuit ----------
// MMF balance around the loop: N i = B (g + gAir)/μ0 + lIron H_iron(B)  (Ampère's law, lumped).
// Linear iron: H = B/(μ0 μr), so B = μ0 N i / g_eff with g_eff = g + gAir + lIron/μr.
// Saturating iron: B = Bs tanh(μ0 μr H / Bs), so H = Bs/(μ0 μr) atanh(B/Bs), which caps B below Bs.
const BMAX = 0.9995;
const gParasitic = () => CONST.gAir + CONST.lIron / CONST.muR;
const gEff = (g) => g + gParasitic();
function hIron(B, sat) {
  if (!sat) return B / (MU0 * CONST.muR);
  const u = Math.min(BMAX, Math.abs(B) / CONST.Bs);
  return (Math.sign(B) * CONST.Bs * Math.atanh(u)) / (MU0 * CONST.muR);
}
function dhIron(B, sat) {
  if (!sat) return 1 / (MU0 * CONST.muR);
  const u = Math.min(BMAX, Math.abs(B) / CONST.Bs);
  return 1 / (MU0 * CONST.muR) / (1 - u * u);
}
const mmfOf = (B, g, sat) => (B * (g + CONST.gAir)) / MU0 + CONST.lIron * hIron(B, sat);
const clampB = (B, sat) => (sat ? Math.min(B, BMAX * CONST.Bs) : B);
// current needed to hold flux linkage λ at gap g
function currentOf(lam, g, q) {
  const B = clampB(lam / (q.N * q.A), q.sat);
  return mmfOf(B, g, q.sat) / q.N;
}
function dCurrent(lam, g, q) {
  const B = clampB(lam / (q.N * q.A), q.sat);
  return ((g + CONST.gAir) / MU0 + CONST.lIron * dhIron(B, q.sat)) / (q.N * q.N * q.A);
}
// gap flux density for a current i at gap g
function bOf(i, g, q) {
  if (i <= 0) return 0;
  g = g * (q.s2 ?? 1);
  const M = q.N * i;
  if (!q.sat) return (MU0 * M) / gEff(g);
  let lo = 0, hi = BMAX * CONST.Bs;
  if (mmfOf(hi, g, true) <= M) return hi;
  for (let n = 0; n < 50; n++) {
    const mid = (lo + hi) / 2;
    if (mmfOf(mid, g, true) < M) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}
// Maxwell stress on the working gap: F = B² A / (2 μ0). In the linear case this is exactly
// F = μ0 N² i² A / (2 g_eff²), the constant-current relation; it also follows from -∂W/∂g at constant λ.
const forceOfB = (B, A) => (B * B * A) / (2 * MU0);
const forceAt = (i, g, q) => forceOfB(bOf(i, g, q), q.A) * (q.s2 ?? 1);
const inductanceAt = (g, q) => (MU0 * q.N * q.N * q.A) / gEff(g * (q.s2 ?? 1)); // small-signal, linear part only

// ---------- drive circuit ----------
// coil terminal voltage while the switch is off and current still flows through the flyback path
function flybackVolts(q) {
  if (q.flyback === "clamp") return CONST.Vd + CONST.Vz;
  if (q.flyback === "none") return Math.max(0, CONST.Vbr - q.V); // drain avalanches at Vbr
  return CONST.Vd;
}
// average coil voltage while switched on, PWM averaged (PWM period much shorter than L/R)
function onVolts(q, seated, i) {
  const d = q.peakHold && !seated ? 1 : q.duty;
  return d * q.V - (1 - d) * (i > 0 ? CONST.Vd : 0);
}
const steadyCurrent = (q, seated = false) => (q.open ? 0 : Math.max(0, onVolts(q, seated, 1) / q.R));

// ---------- simulation ----------
function newState() {
  return {
    t: 0, lam: 0, x: 0, v: 0, i: 0, B: 0, F: 0, on: false, seated: false, stuck: false, xLimit: Infinity,
    Vc: 0, Vds: 0, fric: 0, hit: 0,
    E: { supply: 0, copper: 0, flyback: 0, mag: 0, mech: 0, spring: 0, load: 0, friction: 0, impact: 0, damping: 0 },
  };
}

// one step of dt seconds. `extra` lets Fig 2 add pin friction and a moving stop.
function step(s, q, dt, extra = null) {
  const g = Math.max(CONST.gStop, q.g0 - s.x) * (q.s2 ?? 1); // the gap the flux sees
  // electrical: implicit Euler on flux linkage (stable for every slider combination)
  if (q.open) {
    s.lam = 0; s.i = 0; s.Vc = s.on ? q.V : 0; s.Vds = s.on ? 0 : q.V;
  } else {
    let Vc;
    if (s.on) Vc = onVolts(q, s.seated, s.i);
    else Vc = s.i > 1e-9 ? -flybackVolts(q) : 0;
    let lam = s.lam;
    for (let n = 0; n < 4; n++) {
      const f = lam - s.lam - dt * (Vc - q.R * currentOf(lam, g, q));
      lam -= f / (1 + dt * q.R * dCurrent(lam, g, q));
    }
    if (lam < 0) lam = 0;
    const dLam = lam - s.lam;
    s.lam = lam;
    s.i = currentOf(lam, g, q);
    if (!s.on && s.i < 1e-6) { s.i = 0; s.lam = 0; }
    s.Vc = s.on ? Vc : s.i > 0 ? -flybackVolts(q) : 0;
    s.Vds = s.on ? 0 : s.i > 0 ? q.V + flybackVolts(q) : q.V;
    if (q.flyback === "none" && !s.on && s.i > 0) s.Vds = CONST.Vbr;
    // energy ledger
    if (s.on) s.E.supply += (q.peakHold && !s.seated ? 1 : q.duty) * q.V * s.i * dt;
    s.E.copper += s.i * s.i * q.R * dt;
    if (!s.on) s.E.flyback += flybackVolts(q) * s.i * dt;
    s.E.mag += s.i * dLam; // i dλ goes into the field; the mechanical part is taken out below
  }
  s.B = clampB(s.lam / (q.N * q.A), q.sat);
  s.F = q.open ? 0 : forceOfB(s.B, q.A) * (q.s2 ?? 1);

  // mechanical: +x is pull-in (toward the pole), so the gap is g0 - x
  const Fspring = q.Fpre + q.k * s.x;
  const drive = s.F - Fspring - q.Fload;
  const xTop = Math.min(q.xMax, extra ? extra.limit : Infinity);
  const fs = q.fs + (extra ? extra.fric : 0), fk = q.fk + (extra ? extra.fric : 0);
  s.fric = 0;
  let a = 0;
  const atRest = Math.abs(s.v) < 1e-7;
  if (atRest) {
    s.v = 0;
    if ((s.x <= 0 && drive <= 0) || (s.x >= xTop - 1e-9 && drive >= 0)) { a = 0; s.stuck = false; }
    else if (Math.abs(drive) <= fs) { a = 0; s.stuck = true; s.fric = -drive; }
    else { a = (drive - Math.sign(drive) * fk) / q.m; s.stuck = false; s.fric = -Math.sign(drive) * fk; }
  } else {
    s.fric = -Math.sign(s.v) * fk;
    a = (drive + s.fric - CONST.damp * s.v) / q.m;
    s.stuck = false;
  }
  const v0 = s.v;
  let v = v0 + a * dt;
  if (!atRest && Math.sign(v) !== Math.sign(v0) && Math.abs(drive) <= fs) v = 0; // friction stops it, it doesn't reverse it
  let x = s.x + v * dt;
  s.hit = 0;
  if (x <= 0) {
    x = 0;
    if (v < 0) { s.E.impact += 0.5 * q.m * v * v * (1 - CONST.e ** 2); s.hit = -v; v = -CONST.e * v; if (v < 0.004) v = 0; }
  }
  if (x >= xTop) {
    x = xTop;
    if (v > 0) { s.E.impact += 0.5 * q.m * v * v * (1 - CONST.e ** 2); s.hit = v; v = -CONST.e * v; if (v > -0.004) v = 0; }
  }
  const dx = x - s.x;
  s.E.mech += s.F * dx;
  s.E.mag -= s.F * dx;
  s.E.load += q.Fload * dx;
  s.E.friction += Math.abs(s.fric * dx);
  s.E.damping += CONST.damp * v * v * dt;
  s.x = x; s.v = v;
  s.E.spring = q.Fpre * s.x + 0.5 * q.k * s.x * s.x;
  s.seated = s.x >= q.xMax - 1e-7;
  s.t += dt;
  return s;
}

// coil self-heating: C·dT/dt = P − (T − T_amb)/R_th (one lumped node, illustrative constants)
const heatStep = (T, P, Tamb, dt) => T + ((P - (T - Tamb) / CONST.Rth) / CONST.Cth) * dt;

// can the solenoid start to move the plunger from rest at all, with the full pull-in current?
function actuation(q) {
  const i = steadyCurrent(q, false);
  const F0 = forceAt(i, q.g0, q);
  const need = q.Fpre + q.Fload + q.fs;
  return { i, F0, need, ok: !q.open && F0 > need, margin: F0 - need };
}

// static curves for the plots
function curves(q, iNow, gNow) {
  const iPull = steadyCurrent(q, false);
  const gaps = [], fGap = [], fGapIdeal = [], fGapFlat = [], xs = [], spring = [], net = [], currents = [], fI = [];
  const gMax = q.g0;
  for (let n = 0; n <= 80; n++) {
    const g = CONST.gStop + ((gMax - CONST.gStop) * n) / 80;
    gaps.push(g * 1e3);
    fGap.push(forceAt(iPull, g, q));
    fGapIdeal.push(q.open ? 0 : forceAt(iPull, g, { ...q, sat: false }));
    fGapFlat.push(q.open ? 0 : forceAt(iPull, g, { ...q, s2: 1 }));
  }
  for (let n = 0; n <= 80; n++) {
    const x = (q.stroke * n) / 80;
    xs.push(x * 1e3);
    spring.push(q.Fpre + q.k * x);
    net.push(forceAt(iPull, q.g0 - x, q) - q.Fpre - q.k * x - q.Fload - q.fk);
  }
  const iTop = Math.max(iPull * 1.25, iNow * 1.1, 0.1);
  for (let n = 0; n <= 80; n++) {
    const i = (iTop * n) / 80;
    currents.push(i);
    fI.push(forceAt(i, gNow, q));
  }
  return { iPull, gaps, fGap, fGapIdeal, fGapFlat, xs, spring, net, currents, fI };
}

// ---------- Fig 2: a pin (or a dog clutch) that has to find its slot ----------
// A lock ring turns with the wheel-speed difference; the push-type solenoid drives a pin at its face,
// or slides a dog collar whose teeth must drop between the ring's teeth. Either enters only when a gap
// is within the chamfer's capture window. Once in, the ring's drive torque loads it in shear; the axial
// friction μ·F_shear can then trap it engaged.
const LOCK = {
  holes: 8, rbc: 0.035, holeR: 4.4e-3, pinR: 3.0e-3, chamfer: 0.8e-3, c0: 1.2e-3, depth: 4.0e-3,
};
// geometry in one shape for both mechanisms: count of slots, radius, free clearance each side, capture window
const GEO = {
  pin: { count: LOCK.holes, r: LOCK.rbc, clear: LOCK.holeR - LOCK.pinR, capture: LOCK.holeR - LOCK.pinR + LOCK.chamfer, c0: LOCK.c0, depth: LOCK.depth },
  dog: { count: 12, r: 0.034, clear: 1.8e-3, capture: 2.8e-3, c0: 1.2e-3, depth: 4.0e-3, tooth: 0.4 },
};
function newLock() {
  return { theta: 0, omega: 0, torque: 0, mu: 0.12, inHole: false, locked: false, shear: 0, blocked: false, err: 0 };
}
const TAU = Math.PI * 2;
function holeError(theta, geo = GEO.pin) {
  const pitch = TAU / geo.count;
  let d = ((theta % pitch) + pitch) % pitch;
  if (d > pitch / 2) d -= pitch;
  return -d * geo.r; // arc offset of the nearest slot from the engaging part (m)
}
function stepLock(L, s, q, dt, geo = GEO.pin) {
  const pen = s.x - geo.c0; // how far the pin (or the collar teeth) is past the ring face (or tooth tips)
  L.err = holeError(L.theta, geo);
  L.inHole = pen > 0;
  if (!L.inHole) {
    L.locked = false; L.shear = 0;
    L.theta += L.omega * dt;
    L.err = holeError(L.theta, geo);
    L.blocked = s.x >= geo.c0 - 1e-7 && Math.abs(L.err) > geo.capture;
    return { limit: Math.abs(L.err) > geo.capture ? geo.c0 : Infinity, fric: 0 };
  }
  // engaged: the chamfer has centred it to within the clearance; the ring turns until a flank meets it
  L.blocked = false;
  if (Math.abs(L.err) > geo.clear) L.theta += (Math.sign(L.err) * (Math.abs(L.err) - geo.clear)) / geo.r;
  const next = L.theta + L.omega * dt;
  if (Math.abs(holeError(next, geo)) <= geo.clear) { L.theta = next; L.locked = false; }
  else L.locked = Math.abs(L.omega) > 0 || L.torque > 0;
  L.err = holeError(L.theta, geo);
  // a dog clutch shares the load over all its teeth, but the axial friction is the same μ·T/r
  L.shear = L.locked ? L.torque / geo.r : 0;
  return { limit: Infinity, fric: L.mu * L.shear };
}
// Moving parts of the solenoid figures, drawn from the same functions in the build and in the page.
// Every function takes the kit (`k`), the lathe module (`G`), the projection and the dimensions `D`.
// No imports: the build inlines this file into the page with `export ` stripped.

const DIMS = {
  ZA: 34, // axis height above the bench top (mm)
  rP: 8.0, // plunger radius (Ø16)
  pole: 18, // pole face x (the stop washer sits on it)
  washer: 0.25, // nonmagnetic stop washer thickness (mm)
  lip: 41.2, // +x face of the brass guide-sleeve flange, the spring seat
  plungerLen: 38,
  collar: [29, 30.2, 12.4], // spring collar washer: s0, s1, radius (plunger-local s from its inner face)
  clip: [30.2, 31, 10.6], // e-clip
  pin: 35, // cross pin position along the plunger
  clevis: [31.5, 44.5], // ribbon clevis side plates, s0..s1
  spring: { r: 10.8, wire: 0.45, turns: 5.5 },
  post: [76, 82], // stop post x range
  screwZ: -9, // stop screw height relative to the axis
  drum: [104, -9], // constant-force spring drum centre (x, y); the ribbon leaves it at y = 0
};

// x of the plunger's inner face for a gap g (mm), which is pole face + g (the washer is inside g)
const innerOf = (D, g) => D.pole + g;

// a half-disc polygon (the y <= 0 half) in the axis frame, whose u is +z and v is +y
function halfPoly(r, n = 44) {
  const out = [];
  for (let i = 0; i <= n; i++) {
    const t = Math.PI + (Math.PI * i) / n;
    out.push([r * Math.cos(t), r * Math.sin(t)]);
  }
  return out;
}
const axisFrame = (G, x, z) => G.frameOf([x, 0, z], [1, 0, 0], [0, 0, 1], [0, 1, 0]);

// one cylindrical step of a turned part: whole (lathe disc) or the half behind the cut plane y = 0
function stepSolid(G, P, cut, s0, s1, r, z, x0 = 0) {
  const F = axisFrame(G, x0, z);
  return cut ? G.prismOf(F, halfPoly(r), s0, s1, P) : G.disc(s0, s1, r, F, P);
}
// the cut face of an annulus (or a solid when rIn = 0) in the plane y = 0, as one path
function cutFace(k, P, s0, s1, rIn, rOut, z, x0 = 0) {
  const at = (s, r) => k.iso([x0 + s, 0, z + r], P);
  if (rIn <= 0) return k.pathOf([at(s0, -rOut), at(s1, -rOut), at(s1, rOut), at(s0, rOut)], true);
  return k.pathOf([at(s0, rIn), at(s1, rIn), at(s1, rOut), at(s0, rOut)], true) + k.pathOf([at(s0, -rOut), at(s1, -rOut), at(s1, -rIn), at(s0, -rIn)], true);
}

// the plunger assembly at inner-face x = xi: body pieces either side of the collar, collar, clip.
// Returns svg strings in painter's order slots: `behind` (before the spring's front half), `cut` (cut faces).
function plungerSvg(k, G, P, D, xi, { cut, z = D.ZA, from = D.lip, cls = "m-plunger", cone = 0 }) {
  const S = (paths, c, extra = {}) => k.solidSvg(paths, { tone: "hi", className: c, ...extra });
  const r = D.rP;
  const c0 = xi + D.collar[0], c1 = xi + D.collar[1], e1 = xi + D.clip[1], tip = xi + D.plungerLen;
  const a0 = Math.max(from, xi + 0.6);
  let body = "";
  // piece A: from the sleeve lip (or the inner face when exploded) to the collar
  if (from < xi + 0.6) body += S(stepSolid(G, P, cut, xi, xi + 0.6, r - 0.6, z), cls);
  if (c0 > a0) body += S(stepSolid(G, P, cut, a0, c0, r, z), cls, { lit: true });
  body += S(stepSolid(G, P, cut, c0, c1, D.collar[2], z), "m-zinc");
  body += S(stepSolid(G, P, cut, c1, e1, D.clip[2], z), "m-dark");
  body += S(stepSolid(G, P, cut, e1, tip - 0.6, r, z), cls, { lit: true });
  body += S(stepSolid(G, P, cut, tip - 0.6, tip, r - 0.6, z), cls);
  let faces = "";
  if (cut) {
    const pt = (x, w) => k.iso([x, 0, z + w], P);
    if (cone > 0) faces += `<path class="cut c-plunger" d="${k.pathOf([pt(xi, r), pt(c0, r), pt(c0, -r), pt(xi, -r), pt(xi + cone, -3), pt(xi + cone, 3)], true)}"/>`;
    else faces += `<path class="cut c-plunger" d="${cutFace(k, P, xi, c0, 0, r, z)}"/>`;
    faces += `<path class="cut c-zinc" d="${cutFace(k, P, c0, c1, 0, D.collar[2], z)}"/>`;
    faces += `<path class="cut c-dark" d="${cutFace(k, P, c1, e1, 0, D.clip[2], z)}"/>`;
    faces += `<path class="cut c-plunger" d="${cutFace(k, P, e1, tip, 0, r, z)}"/>`;
    // the cross-pin hole, sectioned
    const ph = (s, w) => k.iso([xi + s, 0, z + w], P);
    faces += `<path class="cut c-pin" d="${k.pathOf([ph(D.pin - 1.25, -r), ph(D.pin + 1.25, -r), ph(D.pin + 1.25, r), ph(D.pin - 1.25, r)], true)}"/>`;
    faces += cone > 0 ? `<path class="cut-edge" d="${k.pathOf([pt(xi, r), pt(tip, r), pt(tip, -r), pt(xi, -r), pt(xi + cone, -3), pt(xi + cone, 3)], true)}"/>` : `<path class="cut-edge" d="${cutFace(k, P, xi, tip, 0, r, z)}"/>`;
  }
  return { body, faces };
}

  { t: "Observe the unpowered state", d: "With the coil off there is no current and no flux. The spring's preload holds the plunger out against the stop screw, so the air gap is at its largest (the initial gap you set).", go: () => { stopAuto(); energize(false); setMode("cut"); pickPlot("xt"); } },
  { t: "Energize the winding", d: "Closing the MOSFET puts the supply across the coil. Watch the supply's ammeter and the flow on the wires: current runs supply → coil → MOSFET → ground.", go: () => { stopAuto(); resetSim(); setMode("circuit"); setSpeed(0.004); energize(true); pickPlot("it"); } },
  { t: "Watch the coil current rise", d: "The current climbs toward V/R with time constant L/R rather than jumping, because the field has to be built first. When the plunger starts to move the current dips: the closing gap raises the inductance and the motion generates a back-EMF.", go: () => { stopAuto(); resetSim(); setMode("cut"); setSpeed(0.004); energize(true); pickPlot("it"); } },
  { t: "Flux through the iron path", d: "Flux follows the iron: through the pole, across the working gap, along the plunger, out through the front plate, back along the can and in through the back plate. The lines' opacity follows the computed gap flux density. Current goes into the page at the top of the winding and out at the bottom; reverse the winding sense in the parameters and the flux reverses, but the pull does not.", go: () => { stopAuto(); resetSim(); setMode("flux"); setSpeed(0.006); energize(true); } },
  { t: "Attraction and plunger movement", d: "The magnetic force (blue) grows as the current and flux build. Once it exceeds spring + load + static friction the plunger moves, the gap shrinks, the force climbs steeply and the plunger accelerates into the stop washer.", go: () => { stopAuto(); resetSim(); setMode("force"); setSpeed(0.004); energize(true); pickPlot("fg"); } },
  { t: "Spring resistance and mechanical work", d: "As the plunger travels x it compresses the spring (F = preload + k·x) and draws out the ribbon against its constant load. The work done, the area under those forces, is stored in the spring or delivered to the load; the rest of the field's work ends as impact at the stop.", go: () => { stopAuto(); setMode("force"); pickPlot("nx"); if (!s.on) energize(true); } },
  { t: "Remove electrical power", d: "Opening the MOSFET doesn't stop the current at once: the coil drives it round the flyback diode. The drain voltage rises to just above the supply.", go: () => { stopAuto(); if (!s.seated) { energize(true); advance(0.06); } setMode("circuit"); setSpeed(0.004); energize(false); pickPlot("it"); } },
  { t: "Current decay and spring return", d: "With a plain diode only about 0.8 V opposes the coil, so the current and flux decay slowly and the plunger stays held for several milliseconds before the spring wins. Switch the flyback path to the 33 V clamp and run it again: the release is several times faster, at the cost of a higher drain voltage.", go: () => { stopAuto(); if (!s.seated) { energize(true); advance(0.06); } setMode("cut"); setSpeed(0.004); energize(false); pickPlot("xt"); } },
  { t: "Explore failure and design trade-offs", d: "Try the failure modes below, or push the design: a larger initial gap needs far more current; peak-and-hold cuts the holding power; heat raises resistance and cuts force. Drag the sliders and watch the force–gap plot and the warnings.", go: () => { state.auto = true; syncAuto(); setMode("cut"); pickPlot("fg"); $(".faults").scrollIntoView({ behavior: reduce.matches ? "auto" : "smooth", block: "start" }); } },
];
let stepIx = 0;
const stepList = $(".steps");
stepList.innerHTML = STEPS.map((st, n) => `<li><button type="button" data-step="${n}">${st.t}</button></li>`).join("");
function showStep(n) {
  stepIx = clamp(n, 0, STEPS.length - 1);
  $$("[data-step]").forEach((b) => b.setAttribute("aria-current", +b.dataset.step === stepIx ? "step" : "false"));
  $(".step-text").innerHTML = `<p class="step-n">Step ${stepIx + 1} of ${STEPS.length}</p><h3>${STEPS[stepIx].t}</h3><p>${STEPS[stepIx].d}</p>`;
}
$$("[data-step]").forEach((b) => b.addEventListener("click", () => { showStep(+b.dataset.step); STEPS[stepIx].go(); }));
$('[data-act="prev"]').addEventListener("click", () => showStep(stepIx - 1));
$('[data-act="next"]').addEventListener("click", () => showStep(stepIx + 1));
$('[data-act="show"]').addEventListener("click", () => { STEPS[stepIx].go(); togglePlay(true); stage.scrollIntoView({ behavior: reduce.matches ? "auto" : "smooth", block: "center" }); });
function stopAuto() { state.auto = false; syncAuto(); }
function pickPlot(p) { state.plot = p; $$("[data-plot]").forEach((x) => x.setAttribute("aria-selected", x.dataset.plot === p ? "true" : "false")); }
function setSpeed(f) { speedEl.value = String(clamp(100 * (1 + Math.log10(f) / 3.3), 0, 100)); syncSpeed(); }

// ---------- coil self-heating (time-lapsed) ----------
const TH = { on: false, Tc: DEFAULTS.T, P: 0, t: 0, trace: { t: [], T: [] }, lapse: 120, demo: 0, demoWait: 0, Tfail: null };
const rawT = () => (TH.on ? TH.Tc : state.raw.T);
function failTemp() {
  // the coil temperature above which the pull-in force at the rest gap no longer beats preload + load + friction
  const okAt = (T) => actuation(resolve({ ...state.raw, T }, state.fault)).ok;
  if (!okAt(state.raw.T)) return state.raw.T;
  if (okAt(400)) return null;
  let lo = state.raw.T, hi = 400;
  for (let n = 0; n < 30; n++) { const m = (lo + hi) / 2; if (okAt(m)) lo = m; else hi = m; }
  return lo;
}
let thRefresh = 0;
function stepHeat(real) {
  if (!TH.on || !state.playing || reduce.matches) return;
  const dt = real * TH.lapse;
  TH.Tc = heatStep(TH.Tc, TH.P, state.raw.T, dt);
  TH.t += dt;
  TH.trace.t.push(TH.t / 60); TH.trace.T.push(TH.Tc);
  while (TH.trace.t.length && TH.trace.t[0] < TH.t / 60 - 30) { TH.trace.t.shift(); TH.trace.T.shift(); }
  thRefresh -= real;
  if (thRefresh <= 0) { thRefresh = 0.2; q = resolve({ ...state.raw, T: TH.Tc }, state.fault); }
  // the demo: hold on until hot, then let the auto cycle try to pull in again
  if (TH.demo === 1 && TH.Tc >= (TH.Tfail ?? 120) + 12) { TH.demo = 2; energize(false); TH.demoWait = 0.8; }
  if (TH.demo === 2 && (TH.demoWait -= real) <= 0) { TH.demo = 3; state.auto = true; syncAuto(); cycleT = 0; }
}
const heatEl = $('[data-act="heat"]');
heatEl.addEventListener("change", () => { TH.on = heatEl.checked; TH.Tc = state.raw.T; TH.t = 0; TH.trace.t.length = TH.trace.T.length = 0; TH.Tfail = failTemp(); TH.demo = 0; applyParams(); });
$('[data-act="soak"]').addEventListener("click", () => {
  TH.on = true; heatEl.checked = true; TH.Tc = state.raw.T; TH.t = 0; TH.trace.t.length = TH.trace.T.length = 0; TH.Tfail = failTemp();
  state.auto = false; syncAuto(); state.raw.peakHold = false; syncControls(); applyParams(); resetSim(); energize(true); TH.demo = 1;
  setMode("cut"); pickPlot("tt"); togglePlay(true);
});

// ---------- main loop ----------
let last = 0;
function frame(now, once = false) {
  const real = last && !once ? Math.min(0.05, (now - last) / 1000) : 0;
  if (!once) last = now;
  if (state.playing && !reduce.matches && real > 0) advance(real * state.speed * (state.slow ? 0.1 : 1));
  stepHeat(real);
  stepView(real || 0.016);
  stepExplode(real || 0.016);
  drawDynamic();
  drawOverlays(state.playing ? real : 0);
  readouts();
  plotTimer -= real;
  if (plotTimer <= 0 || once) { plotTimer = 0.08; drawPlot(); schematic(); }
  if (!once) requestAnimationFrame(frame);
}
syncControls();
syncFaults();
syncSpeed();
showStep(0);
applyParams();
setMode(DATA.GALLERY ? "circuit" : "cut");
vb = [...vbTo];
if (reduce.matches) {
  // one still pose: energized and seated, magnetic view
  state.auto = false; syncAuto(); energize(true); advance(0.06); setMode(DATA.GALLERY ? "circuit" : "flux"); vb = [...vbTo];
}
requestAnimationFrame(frame);
</script></body></html>
