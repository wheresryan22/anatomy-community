<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GitLab Runner</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(720px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>
.gr-cable{fill:none;stroke:var(--anatomy-shade-0);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.gr-lamp{fill:var(--anatomy-shade-0);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);transition:fill .35s}
.gr-lamp[data-state="pending"],.gr-lamp[data-state="idle"]{fill:var(--anatomy-mid)}
.gr-lamp[data-state="running"],.gr-lamp[data-state="polling"],.gr-lamp[data-state="busy"]{fill:var(--anatomy-lit);stroke:var(--anatomy-lit)}
.gr-lamp[data-state="passed"]{fill:var(--anatomy-green);stroke:var(--anatomy-green)}
.gr-lamp[data-state="paused"]{fill:var(--anatomy-shade-0);stroke:var(--anatomy-faint)}
.gr-pulse{fill:var(--anatomy-lit);stroke:var(--anatomy-paper);stroke-width:.6}
.gr-pulse[data-kind="none"]{fill:var(--anatomy-paper);stroke:var(--anatomy-mid)}
.gr-trace{transition:opacity .4s}
.gr-band{fill:var(--anatomy-mid);stroke:none;transition:fill .3s}
.gr-band[data-status="running"]{fill:var(--anatomy-lit)}
.gr-band[data-status="passed"]{fill:var(--anatomy-green)}
.gr-band[data-status="canceled"]{fill:var(--anatomy-paper);stroke:var(--anatomy-mid);stroke-width:.4}
.gr-ctl{cursor:pointer}
.gr-hit{fill:transparent;stroke:none;pointer-events:all}
.gr-ctl:hover .iso-edge{stroke:var(--anatomy-lit)}
.gr-ctl:focus{outline:none}
.iso-stage{outline:none;touch-action:pan-y}
@media (max-width:560px){.iso-plate-corner[data-corner="hint"]{white-space:normal;right:0;line-height:1.5}}
.iso-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
@media (prefers-reduced-motion:reduce){.gr-lamp,.gr-trace,.gr-band{transition:none}}

5 8 7.5 14 4.5"/></svg>Keys = tags: docker along, prod across; a runner's tag plate and seat show the keys it accepts</span><span class="iso-key"><svg class="iso-swatch" data-mark="dim" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Commit card band: pipeline pending, running, passed, or hollow when canceled</span></span><span class="iso-caption">GitLab never pushes work to a runner. Each runner asks the coordinator for a job every 3 s (check_interval) over its own cable; GitLab hands over the oldest pending job whose tags the runner has (a puck whose key fits the seat), or nothing. The runner carries the job to its executor, streams the log back while it runs and reports the result. Only when every job of a stage has passed do the next stage's jobs become pending: runner-a has only docker, so deploy (prod) waits for runner-b. Each push raises a commit card and creates a pipeline for that commit; the card's band carries the pipeline's status. These jobs are interruptible, so pushing while a pipeline runs cancels it (hollow band): the runners abort, bring their jobs back, and the jobs reset for the new commit. Flip runner-b's switch back and deploy stays stuck.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],

    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {

function signedArea(points) {

function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);

    const lower = [];

function runsOf(flags, want) {

function extrude(ring, z, height, projection, options = {}) {

    const count = ring.length;

// The truth the figure shows: a GitLab pipeline whose jobs are picked up by
// runners that poll the coordinator, run the job and report back.
//
// - Every push creates one pipeline for that commit. Its status (pending,
//   running, passed, canceled) belongs to the commit, as in GitLab's commit list.
// - Stages run in order; the jobs of one stage run in parallel (no `needs:`).
//   A stage's jobs go from `created` to `pending` once every job of the stage
//   before it has passed.
// - A runner never receives a push. It asks: `POST /api/v4/jobs/request`,
//   every `check_interval` (3 s by default) while it has a free slot.
//   GitLab answers 201 with the oldest pending job whose tags are all among the
//   runner's tags, or 204 when there is none.
// - The runner runs the job in its executor, streams the log back
//   (`PATCH /api/v4/jobs/:id/trace`) and reports the final state
//   (`PUT /api/v4/jobs/:id`). Each runner here has `concurrent = 1`.
// - Every job here is `interruptible: true`, so with the default auto-cancel
//   (`on_new_commit: conservative`) a newer commit on the branch cancels the
//   older pipeline, running jobs included; a runner learns it from the
//   reply to its next trace update and aborts.

const CHECK_INTERVAL = 3;
const STAGES = ["build", "test", "deploy"];
const JOBS = [
  { name: "compile", stage: 0, tags: ["docker"], dur: 4.2 },
  { name: "unit", stage: 1, tags: ["docker"], dur: 5.6 },
  { name: "lint", stage: 1, tags: ["docker"], dur: 3.2 },
  { name: "e2e", stage: 1, tags: ["docker"], dur: 4.8 },
  { name: "deploy", stage: 2, tags: ["prod"], dur: 3.4 },
];
const RUNNERS = [
  { name: "runner-a", tags: ["docker"], firstPoll: 0.6 },
  { name: "runner-b", tags: ["docker", "prod"], firstPoll: 2.1 },
];

// Timings of the machine itself (not GitLab's): how long the moves take.
const TRIP = 0.5; // one way along the API cable
const DRIVE = 1.3; // carriage between pickup and executor
const LIFT = 0.32; // gantry quill up or down
const SPAN = 150; // gantry speed, units per second
const REST = 4; // pause after a passed pipeline before the next push
const SWEEP = 0.14; // job lamps reset one after another when a pipeline is created
const KEEP = 5; // commits kept on the rack

const smooth = (t) => (t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t));
const fits = (job, runner) => job.tags.every((tag) => runner.tags.includes(tag));
// A short SHA that is the same for the same pipeline number on every load.
const shaOf = (number) => {
  let h = (number * 2654435761) >>> 0;
  let out = "";
  for (let i = 0; i < 7; i++) {
    h = Math.imul(h ^ (h >>> 15), 2246822519) >>> 0;
    out += "0123456789abcdef"[h & 15];
  }
  return out;
};

// `place` gives the gantry the world points it travels to:
// { slot(index) -> [x, y], seat(runnerIndex) -> [x, y], up, atSlot, atSeat }.
function createSim(place) {
  const sim = {
    t: 0,
    number: 11,
    state: "running",
    restAt: 0,
    createdAt: 0,
    pushes: 0,
    commits: [
      { number: 9, sha: shaOf(9), status: "passed" },
      { number: 10, sha: shaOf(10), status: "canceled" },
      { number: 11, sha: shaOf(11), status: "passed" },
    ],
    jobs: JOBS.map((job, index) => ({ ...job, index, state: "created", prev: "passed", where: "slot", runner: -1 })),
    runners: RUNNERS.map((runner, index) => ({
      ...runner,
      index,
      online: true,
      state: "idle",
      nextPoll: runner.firstPoll,
      job: -1,
      pipe: 0, // the pipeline the runner's job belongs to
      pulse: null, // { dir: "up" | "down", at: 0..1, kind: "ask" | "job" | "none" }
      drive: 0, // 0 at pickup, 1 at executor
      backFrom: 1,
      phaseAt: 0,
    })),
    gantry: { x: place.slot(0)[0], y: place.slot(0)[1], z: place.up, legs: [], queue: [], task: null, holding: -1 },
    last: "",
  };
  const commit = () => sim.commits[sim.commits.length - 1];

  const startPipeline = () => {
    sim.number += 1;
    sim.state = "running";
    sim.createdAt = sim.t;
    sim.commits.push({ number: sim.number, sha: shaOf(sim.number), status: "pending" });
    if (sim.commits.length > KEEP + 1) sim.commits.shift();
    for (const job of sim.jobs) {
      job.prev = job.state === "passed" ? "passed" : job.state === "created" ? "created" : "canceled";
      Object.assign(job, { state: "created", runner: -1 });
    }
    unlock();
  };

  const unlock = () => {
    for (let stage = 0; stage < STAGES.length; stage++) {
      const jobs = sim.jobs.filter((job) => job.stage === stage);
      if (jobs.some((job) => job.state === "created")) {
        for (const job of jobs) if (job.state === "created") job.state = "pending";
        return;
      }
      if (!jobs.every((job) => job.state === "passed")) return;
    }
    if (sim.state === "running") {
      sim.state = "passed";
      sim.restAt = sim.t;
      commit().status = "passed";
      sim.last = `pipeline #${sim.number} passed`;
    }
  };

  // A newer commit cancels this pipeline: queued hand-offs are dropped and
  // every runner holding one of its jobs aborts and brings the job back.
  const cancel = () => {
    commit().status = "canceled";
    const g = sim.gantry;
    for (const runner of sim.runners) {
      if (runner.job < 0) continue;
      if (runner.state === "assigned") {
        const queued = g.queue.findIndex((task) => task.kind === "deliver" && task.runner === runner.index);
        if (queued >= 0) {
          g.queue.splice(queued, 1);
          runner.job = -1;
          runner.state = "idle";
          runner.nextPoll = sim.t + 0.4;
        }
      } else if (runner.state === "loaded" || runner.state === "running") {
        runner.state = "back";
        runner.backFrom = runner.drive;
        runner.phaseAt = sim.t;
      }
    }
  };

  // The gantry is the coordinator's hand: it carries the job to a runner's
  // pickup seat and back. Its legs are straight moves eased end to end.
  const leg = (to, after) => {
    const g = sim.gantry;
    const from = g.legs.length ? g.legs[g.legs.length - 1].to : [g.x, g.y, g.z];
    const flat = Math.hypot(to[0] - from[0], to[1] - from[1]);
    const dur = flat > 0.01 ? Math.max(0.35, flat / SPAN) : LIFT;
    g.legs.push({ from, to, dur, at: 0, after });
  };
  const transfer = (fromXY, fromZ, toXY, toZ, onGrip, onDrop) => {
    leg([fromXY[0], fromXY[1], place.up]);
    leg([fromXY[0], fromXY[1], fromZ], onGrip);
    leg([fromXY[0], fromXY[1], place.up]);
    leg([toXY[0], toXY[1], place.up]);
    leg([toXY[0], toXY[1], toZ], onDrop);
    leg([toXY[0], toXY[1], place.up]);
  };
  const runTask = (task) => {
    const g = sim.gantry;
    g.task = task;
    const job = sim.jobs[task.job];
    const runner = sim.runners[task.runner];
    if (task.kind === "deliver") {
      transfer(place.slot(job.index), place.atSlot, place.seat(runner.index), place.atSeat,
        () => { g.holding = job.index; job.where = "gantry"; },
        () => { g.holding = -1; job.where = "runner"; runner.state = "loaded"; runner.phaseAt = sim.t; });
    } else {
      transfer(place.seat(runner.index), place.atSeat, place.slot(job.index), place.atSlot,
        () => { g.holding = job.index; job.where = "gantry"; runner.job = -1; runner.state = "idle"; runner.nextPoll = sim.t + 0.4; },
        () => { g.holding = -1; job.where = "slot"; });
    }
  };

  // A job can be handed out only while its puck is home and nobody holds it.
  const free = (job) => job.where === "slot" && !sim.runners.some((runner) => runner.job === job.index);
  const poll = (runner) => {
    const job = sim.jobs.find((candidate) => candidate.state === "pending" && free(candidate) && fits(candidate, runner));
    if (!job) return "none";
    job.state = "running";
    job.runner = runner.index;
    runner.job = job.index;
    runner.pipe = sim.number;
    if (commit().status === "pending") commit().status = "running";
    sim.last = `${runner.name} picked ${job.name}`;
    return "job";
  };

  const stepRunner = (runner, dt) => {
    if (runner.pulse) {
      runner.pulse.at += dt / TRIP;
      if (runner.pulse.at >= 1) {
        if (runner.pulse.dir === "up") {
          runner.pulse = { dir: "down", at: 0, kind: poll(runner) };
        } else {
          const kind = runner.pulse.kind;
          runner.pulse = null;
          if (kind === "job" && runner.pipe === sim.number) {
            runner.state = "assigned";
            sim.gantry.queue.push({ kind: "deliver", job: runner.job, runner: runner.index });
          } else {
            // A job canceled while its answer was on the way is never fetched.
            runner.job = -1;
            runner.state = "idle";
            runner.nextPoll = sim.t + (kind === "job" ? 0.4 : CHECK_INTERVAL);
          }
        }
      }
      return;
    }
    if (runner.state === "idle" && runner.online && sim.t >= runner.nextPoll) {
      runner.state = "polling";
      runner.pulse = { dir: "up", at: 0, kind: "ask" };
    } else if (runner.state === "loaded") {
      if (runner.pipe !== sim.number) {
        runner.state = "back";
        runner.backFrom = runner.drive;
        runner.phaseAt = sim.t;
        return;
      }
      runner.drive = smooth((sim.t - runner.phaseAt) / DRIVE);
      if (sim.t - runner.phaseAt >= DRIVE) {
        runner.state = "running";
        runner.phaseAt = sim.t;
      }
    } else if (runner.state === "running") {
      const job = sim.jobs[runner.job];
      if (sim.t - runner.phaseAt >= job.dur) {
        job.state = "passed";
        sim.last = `${runner.name} reported ${job.name} passed`;
        runner.state = "back";
        runner.backFrom = 1;
        runner.phaseAt = sim.t;
        unlock();
      }
    } else if (runner.state === "back") {
      const dur = DRIVE * Math.max(0.25, runner.backFrom);
      runner.drive = runner.backFrom * (1 - smooth((sim.t - runner.phaseAt) / dur));
      if (sim.t - runner.phaseAt >= dur) {
        runner.drive = 0;
        runner.state = "done";
        sim.gantry.queue.push({ kind: "return", job: runner.job, runner: runner.index });
      }
    }
  };

  const stepGantry = (dt) => {
    const g = sim.gantry;
    if (!g.legs.length) {
      g.task = null;
      // Returns first: they free a runner and cost the coordinator nothing.
      const next = g.queue.findIndex((task) => task.kind === "return");
      const pick = next >= 0 ? next : g.queue.length ? 0 : -1;
      if (pick >= 0) runTask(g.queue.splice(pick, 1)[0]);
      return;
    }
    const current = g.legs[0];
    current.at += dt / current.dur;
    const k = smooth(current.at);
    [g.x, g.y, g.z] = current.from.map((value, axis) => value + (current.to[axis] - value) * k);
    if (current.at >= 1) {
      g.legs.shift();
      current.after?.();
    }
  };

  sim.step = (dt) => {
    // Fixed sub-steps keep every threshold exact whatever the frame rate.
    let left = dt;
    while (left > 1e-6) {
      const h = Math.min(left, 1 / 120);
      left -= h;
      sim.t += h;
      stepGantry(h);
      for (const runner of sim.runners) stepRunner(runner, h);
      if (sim.state === "passed" && sim.t - sim.restAt >= REST) {
        startPipeline();
        sim.last = `pushed ${commit().sha} · pipeline #${sim.number} created`;
      }
    }
  };
  sim.push = () => {
    sim.pushes += 1;
    const old = sim.state === "running" ? sim.number : 0;
    if (old) cancel();
    startPipeline();
    sim.last = `pushed ${commit().sha} · pipeline #${sim.number} created` + (old ? ` · #${old} canceled` : "");
  };
  sim.toggle = (index) => {
    const runner = sim.runners[index];
    runner.online = !runner.online;
    sim.last = `${runner.name} ${runner.online ? "resumed" : "paused"}`;
    if (runner.online && runner.state === "idle") runner.nextPoll = Math.min(runner.nextPoll, sim.t + 0.2);
  };
  // What a job's lamp shows: after a push the lamps reset to the new pipeline one by one.
  sim.lamp = (job) => (sim.t < sim.createdAt + 0.25 + SWEEP * job.index ? job.prev : job.state);
  sim.stage = () => {
    for (let stage = 0; stage < STAGES.length; stage++) {
      if (sim.jobs.some((job) => job.stage === stage && job.state !== "passed")) return stage;
    }
    return -1;
  };
  sim.readout = () => {
    const head = `#${sim.number} ${commit().sha}`;
    const stage = sim.stage();
    if (stage < 0) return `${head} · passed`;
    const jobs = sim.jobs.filter((job) => job.stage === stage);
    const pending = jobs.filter((job) => job.state === "pending");
    const running = jobs.filter((job) => job.state === "running");
    const stuck = pending.find((job) => !sim.runners.some((runner) => runner.online && fits(job, runner)));

  seat: (index) => [DATA.runnerX[index], DATA.homeY],
  up: DATA.up,
  atSlot: DATA.atSlot,
  atSeat: DATA.atSeat,
});

const holders = sim.jobs.map((_, index) => q(`[data-hold-puck="${index}"]`));
const slots = sim.jobs.map((_, index) => q(`[data-slot="${index}"]`));
const seats = sim.runners.map((_, index) => q(`[data-seat="${index}"]`));
const carriages = sim.runners.map((_, index) => q(`[data-carriage="${index}"]`));
const grips = sim.runners.map((_, index) => q(`[data-grip="${index}"]`));
const rams = sim.runners.map((_, index) => q(`[data-ram="${index}"]`));
const needles = sim.runners.map((_, index) => q(`[data-needle="${index}"]`));
const traces = sim.runners.map((_, index) => q(`.gr-trace[data-runner="${index}"]`));
const pulses = sim.runners.map((_, index) => q(`.gr-pulse[data-runner="${index}"]`));
const runnerLamps = sim.runners.map((_, index) => q(`.gr-lamp[data-runner="${index}"]`));
const levers = sim.runners.map((_, index) => q(`[data-lever="${index}"]`));
const switches = sim.runners.map((_, index) => q(`[data-switch="${index}"]`));
const jobLamps = sim.jobs.map((_, index) => q(`.gr-lamp[data-job="${index}"]`));
const quill = q("[data-quill]");
const carry = q("[data-carry]");
const bridge = q("[data-bridge]");
const head = q("[data-head]");
const cardBox = q("[data-cards]");
const pushButton = q("[data-push]");
const cap = q("[data-cap]");
const pushPulse = q("[data-push-pulse]");

const quillSvg = (z) =>
  solidSvg(cylinder(0, 0, 1.8, z + DATA.gripH, DATA.bridgeZ - z - DATA.gripH, P, 16), { tone: "mid", crease: "none" }) +
  solidSvg(cylinder(0, 0, 4.4, z, DATA.gripH, P, 28, 0.3), { tone: "mid", crease: "lo" }) +
  lineSvg(sideArc(0, 0, 4.4, z + 1.2, P, 20), { tone: "faint" });
const ramSvg = (rx, z, lit) =>
  solidSvg(cylinder(rx, DATA.workY, 2.2, z + 2.4, DATA.pressZ - z - 2.4, P, 18), { tone: "hi", crease: "none", lit }) +
  solidSvg(cylinder(rx, DATA.workY, 5.2, z, 2.4, P, 28, 0.4), { tone: "hi", crease: "lo", lit });
const needleAt = (rx, share) => {
  const angle = share * Math.PI * 2;
  const [x, y] = [rx + 15, DATA.workY];
  return lineOnTop([x - Math.sin(angle) * 1.6, y + Math.cos(angle) * 1.6], [x + Math.sin(angle) * 4.3, y - Math.cos(angle) * 4.3], DATA.gaugeTop + 0.1, P);
};

// Points along each cable, by length, so a pulse runs at an even pace.
const cables = DATA.cables.map((points) => {
  const flat = points.map((point) => iso(point, P));
  const lengths = [0];
  for (let i = 1; i < flat.length; i++) lengths.push(lengths[i - 1] + Math.hypot(flat[i][0] - flat[i - 1][0], flat[i][1] - flat[i - 1][1]));
  return { flat, lengths, total: lengths[lengths.length - 1] };
});
const alongCable = (cable, share) => {
  const want = share * cable.total;
  let i = 1;
  while (i < cable.lengths.length - 1 && cable.lengths[i] < want) i++;
  const span = cable.lengths[i] - cable.lengths[i - 1] || 1;
  const t = Math.min(1, Math.max(0, (want - cable.lengths[i - 1]) / span));
  const [a, b] = [cable.flat[i - 1], cable.flat[i]];
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
};

const pushCable = (() => {
  const flat = DATA.pushCable.map((point) => iso(point, P));
  const lengths = [0];
  for (let i = 1; i < flat.length; i++) lengths.push(lengths[i - 1] + Math.hypot(flat[i][0] - flat[i - 1][0], flat[i][1] - flat[i - 1][1]));
  return { flat, lengths, total: lengths[lengths.length - 1] };
})();
// A push travels up the cable; GitLab creates the pipeline when it arrives.
const pushes = [];
const ease = (value, target, dt, seconds) => (dt === 0 ? target : value + (target - value) * (1 - Math.exp(-dt / seconds)));

// Commit cards: one per commit on the rack, newest in front. A new card rises out of its slot.
const cards = new Map();
cardBox.querySelectorAll("[data-card]").forEach((el) => {
  const number = Number(el.dataset.card);
  const slot = sim.commits.length - 1 - sim.commits.findIndex((commit) => commit.number === number);
  cards.set(number, { el, rise: el.querySelector("[data-rise]"), band: el.querySelector(".gr-band"), slot, drop: 0, alpha: 1, status: "" });
});
const cardAt = (slot) => translateAlong(P, [0, DATA.cardFront - slot * DATA.cardPitch, 0]);
function drawCards(dt) {
  const shown = sim.commits.slice(-KEEP);
  shown.forEach((commit, index) => {
    let card = cards.get(commit.number);
    if (!card) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", "g");
      el.setAttribute("data-card", String(commit.number));
      el.innerHTML = DATA.card.replace("__STATUS__", commit.status).replace("__SHA__", commit.sha).replace("__NUM__", `#${commit.number}`);
      cardBox.appendChild(el);
      card = { el, rise: el.querySelector("[data-rise]"), band: el.querySelector(".gr-band"), slot: 0, drop: dt === 0 ? 0 : -DATA.cardH, alpha: 1, status: "" };
      cards.set(commit.number, card);
    }
    card.target = shown.length - 1 - index;
  });
  for (const [number, card] of cards) {
    const commit = shown.find((entry) => entry.number === number);
    if (!commit) card.target = KEEP;
    card.slot = ease(card.slot, card.target, dt, 0.16);
    card.drop = ease(card.drop, 0, dt, 0.14);
    if (Math.abs(card.drop) < 0.02) card.drop = 0;
    // The oldest card slides off the back of the rack and fades.
    card.alpha = commit ? 1 : Math.max(0, 1 - Math.max(0, card.slot - (KEEP - 1)) * 1.4);
    if (!commit && (card.alpha <= 0.01 || dt === 0)) {
      card.el.remove();
      cards.delete(number);
      continue;
    }
    card.el.setAttribute("transform", cardAt(card.slot));
    card.rise.setAttribute("transform", card.drop ? translateAlong(P, [0, 0, card.drop]) : "");
    card.el.style.opacity = card.alpha < 1 ? card.alpha.toFixed(2) : "";
    if (commit && card.status !== commit.status) {
      card.band.setAttribute("data-status", commit.status);
      card.status = commit.status;
    }
  }
}

// Ram: eases down onto the job, taps once per script line, eases up when done.
const ram = sim.runners.map(() => ({ z: DATA.ramRest }));
const lever = sim.runners.map((runner) => ({ angle: runner.online ? 26 : -26 }));
const lastState = { jobs: [], runners: [], quillZ: null, ramZ: [], lit: [], lever: [] };
let pressedAt = -10;

function draw(dt) {
  const g = sim.gantry;
  bridge.setAttribute("transform", translateAlong(P, [g.x, 0, 0]));
  head.setAttribute("transform", translateAlong(P, [0, g.y, 0]));
  const move = translateAlong(P, [g.x, g.y, 0]);
  quill.setAttribute("transform", move);
  carry.setAttribute("transform", move);
  const quillZ = Math.round(g.z * 20) / 20;
  if (quillZ !== lastState.quillZ) {
    quill.innerHTML = quillSvg(quillZ);
    lastState.quillZ = quillZ;
  }

  sim.jobs.forEach((job, index) => {
    const holder = holders[index];
    if (job.where === "slot") {
      if (holder.parentNode !== slots[index]) slots[index].appendChild(holder);
      holder.setAttribute("transform", translateAlong(P, [DATA.slotX[index], DATA.slotY, DATA.trayTop]));
    } else if (job.where === "gantry") {
      if (holder.parentNode !== carry) carry.appendChild(holder);
      holder.setAttribute("transform", translateAlong(P, [0, 0, g.z - DATA.puckTop]));
    } else {
      const owner = sim.runners.find((runner) => runner.job === index);
      const seat = seats[owner ? owner.index : 0];
      if (holder.parentNode !== seat) seat.appendChild(holder);
      holder.setAttribute("transform", translateAlong(P, [DATA.runnerX[owner ? owner.index : 0], DATA.homeY, DATA.seatTop]));
    }
    const lit = sim.runners.some((runner) => runner.job === index && runner.state === "running");
    if (lastState.lit[index] !== lit) {
      holder.querySelectorAll(".iso-solid").forEach((solid) => (lit ? solid.setAttribute("data-lit", "") : solid.removeAttribute("data-lit")));
      lastState.lit[index] = lit;
    }
    const lamp = sim.lamp(job);
    if (lastState.jobs[index] !== lamp) {
      jobLamps[index].setAttribute("data-state", lamp);
      lastState.jobs[index] = lamp;
    }
  });

  sim.runners.forEach((runner, index) => {
    const rx = DATA.runnerX[index];
    const travel = translateAlong(P, [0, runner.drive * (DATA.workY - DATA.homeY), 0]);
    carriages[index].setAttribute("transform", travel);
    grips[index].setAttribute("transform", travel);
    const running = runner.state === "running";
    const job = runner.job >= 0 ? sim.jobs[runner.job] : null;
    const elapsed = running ? sim.t - runner.phaseAt : 0;
    let want = DATA.ramRest;
    if (running) {
      const left = job.dur - elapsed;
      want = left < 0.35 ? DATA.ramRest : DATA.atSeat + 1.4 * Math.max(0, Math.sin(elapsed * Math.PI * 1.6)) ** 6;
    }
    ram[index].z = ease(ram[index].z, want, dt, 0.09);
    const ramZ = Math.round(ram[index].z * 20) / 20;
    const key = `${ramZ}|${running}`;
    if (lastState.ramZ[index] !== key) {
      rams[index].innerHTML = ramSvg(rx, ramZ, running);
      lastState.ramZ[index] = key;
    }
    const share = running ? Math.min(1, elapsed / job.dur) : runner.state === "back" || runner.state === "done" ? 1 : 0;
    needles[index].setAttribute("d", needleAt(rx, share));
    traces[index].style.opacity = running ? "1" : "0";

    const pulse = pulses[index];
    if (runner.pulse && !still.matches) {
      const along = runner.pulse.dir === "up" ? runner.pulse.at : 1 - runner.pulse.at;
      const [x, y] = alongCable(cables[index], along);
      pulse.setAttribute("cx", x.toFixed(2));
      pulse.setAttribute("cy", y.toFixed(2));
      pulse.setAttribute("data-kind", runner.pulse.kind);
      pulse.setAttribute("r", runner.pulse.kind === "job" ? "2.2" : "1.7");
      pulse.style.opacity = String(Math.min(1, Math.min(runner.pulse.at, 1 - runner.pulse.at) * 12));
    } else pulse.style.opacity = "0";

    const lampState = !runner.online && runner.state === "idle" ? "paused" : runner.pulse ? "polling" : runner.state === "idle" ? "idle" : "busy";
    if (lastState.runners[index] !== lampState) {
      runnerLamps[index].setAttribute("data-state", lampState);
      lastState.runners[index] = lampState;
    }
    // A toggle snaps over its centre: a quick ease, picked from prebuilt lever angles.
    lever[index].angle = ease(lever[index].angle, runner.online ? 26 : -26, dt, 0.05);
    let frame = 0;
    DATA.leverAngles.forEach((angle, i) => {
      if (Math.abs(angle - lever[index].angle) < Math.abs(DATA.leverAngles[frame] - lever[index].angle)) frame = i;
    });
    if (lastState.lever[index] !== frame) {
      levers[index].innerHTML = DATA.levers[index][frame];
      lastState.lever[index] = frame;
    }
  });

  const leading = pushes[0];
  if (leading && !still.matches) {
    const [x, y] = alongCable(pushCable, leading.at);
    pushPulse.setAttribute("cx", x.toFixed(2));
    pushPulse.setAttribute("cy", y.toFixed(2));
    pushPulse.style.opacity = String(Math.min(1, Math.min(leading.at, 1 - leading.at) * 12));
  } else pushPulse.style.opacity = "0";
  drawCards(dt);
  const age = sim.t - pressedAt;
  const depth = dt === 0 || age < 0 ? 0 : age < 0.06 ? age / 0.06 : Math.max(0, 1 - (age - 0.06) / 0.22);
  cap.setAttribute("transform", depth > 0 ? translateAlong(P, [0, 0, -1.2 * depth]) : "");

  const text = sim.readout();
  if (readout.textContent !== text) readout.textContent = text;
  if (status.textContent !== sim.last) status.textContent = sim.last;
}

let frame = 0;
let last = 0;
let visible = false;
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  for (const entry of pushes) entry.at += dt / TRIP;
  while (pushes.length && pushes[0].at >= 1) {
    pushes.shift();
    sim.push();
  }
  sim.step(dt);
  draw(dt);
  frame = visible && !still.matches ? requestAnimationFrame(tick) : 0;
}
// Reduced motion: one still pose. The machine jumps straight to where an action leads:
// the pipeline run to its end, or to where it gets stuck.
const settle = (limit) => {
  const stuck = () => sim.readout().includes("stuck");
  for (let t = 0; t < limit && sim.state !== "passed" && !stuck(); t += 1 / 30) sim.step(1 / 30);
  draw(0);
};
const run = () => {
  if (!frame && visible && !still.matches) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
};
const push = () => {
  if (still.matches) {
    sim.push();
    settle(120);
    return;
  }
  pressedAt = sim.t;
  pushes.push({ at: 0 });
  status.textContent = "git push";
  run();
};
const flip = (index) => {
  sim.toggle(index);
  if (still.matches) settle(120);
  else run();
};
pushButton.addEventListener("click", push);
switches.forEach((el, index) => el.addEventListener("click", () => flip(index)));
stage.addEventListener("keydown", (event) => {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    push();
  } else if (event.key === "1" || event.key === "2") {
    flip(Number(event.key) - 1);
  }
});
new IntersectionObserver(
  (entries) => {
    visible = entries[entries.length - 1].isIntersecting;
    if (visible) run();
  },
  { rootMargin: "120px 0px" },
).observe(stage);
still.addEventListener("change", () => (still.matches ? draw(0) : run()));
window.__sim = sim;
// The still pose: the test stage under way, two jobs on the runners.
if (still.matches) settle(13);
draw(0);
</script></body></html>
